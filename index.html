<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smart Heart 3.0</title>
<meta name="description" content="See the electricity, hear the valves. A synchronized ECG and heart-sound trainer in English, Russian and Uzbek, with a built-in first-year glossary.">
<meta property="og:title" content="Smart Heart 3.0 — see the electricity, hear the valves">
<meta property="og:description" content="One synthesized heartbeat drives both the ECG and the heart sounds. 17 rhythms, 6 valve lesions, 16 clinical cases, an exam and a hover-to-learn glossary. English · Русский · Oʻzbekcha.">
<meta name="theme-color" content="#06080b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#06080b;--bg2:#090c11;--panel:#0d1218;--panel2:#121922;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);--text:#e9edf2;--muted:#8d97a6;--dim:#5a6472;--ecg:#3cf5a0;--pcg:#ffb648;--heart:#ff4d6d;--sky:#7cc4ff;--good:#3cf5a0;--bad:#ff5d73;--r:18px;--mono:'JetBrains Mono',ui-monospace,monospace;--serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(1100px 600px at 0% -10%,rgba(255,77,109,.09),transparent 60%),radial-gradient(900px 520px at 100% 0%,rgba(60,245,160,.05),transparent 60%),var(--bg);overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1400px;margin:0 auto;padding:14px 16px 40px}
header.top{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:4px 2px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-family:var(--serif);font-weight:600;font-size:27px;letter-spacing:.005em;line-height:1}
.brand h1 em,.intro h2 em{font-style:italic;font-weight:400;color:var(--heart)}
.brand small{display:block;margin-top:5px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
nav.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
nav.tabs button{padding:8px 18px;border-radius:999px;font-size:14px;color:var(--muted);font-weight:500;transition:.2s}
nav.tabs button.on{background:var(--text);color:#0a0d12}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;align-items:start}
.left{display:grid;gap:16px;min-width:0}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);position:relative}
.mon-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:16px 18px 10px}
.mon-head .rn{font-family:var(--serif);font-size:24px;font-weight:500;line-height:1.1}
.mon-head .sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.hr{display:flex;align-items:baseline;gap:8px;font-family:var(--mono)}
.hr b{font-size:44px;font-weight:700;color:var(--ecg);line-height:.9;text-shadow:0 0 18px rgba(60,245,160,.35);min-width:2.2ch;text-align:right}
.hr span{font-size:11px;color:var(--muted);letter-spacing:.1em}
.hr svg{width:20px;height:20px;align-self:center;transition:transform .12s}
.hr svg.beat{transform:scale(1.35)}
.screen{position:relative;height:clamp(280px,40vh,390px);margin:0 10px;border-radius:12px;overflow:hidden;background:#04070a;border:1px solid rgba(60,245,160,.10);box-shadow:inset 0 0 60px rgba(0,0,0,.6)}
.screen canvas{position:absolute;inset:0;width:100%;height:100%}
.lane-lab{position:absolute;left:12px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;pointer-events:none}
.lane-lab.e{top:10px;color:var(--ecg)} .lane-lab.p{color:var(--pcg)}
.mon-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px 14px}
.cap{font-size:12.5px;color:var(--muted);line-height:1.45;max-width:640px}
.cap b{color:var(--text);font-weight:500}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line2);border-radius:999px;padding:7px 12px;font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;transition:.15s;background:rgba(255,255,255,.02)}
.pill:hover{color:var(--text);border-color:rgba(255,255,255,.25)}
.pill.on{color:#07090c;background:var(--text);border-color:var(--text)}
.breath{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--sky)}
.breath i{display:block;width:46px;height:5px;border-radius:9px;background:rgba(124,196,255,.15);overflow:hidden}
.breath i u{display:block;height:100%;background:var(--sky);width:30%}
.row2{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px}
.heart-card{padding:14px 14px 12px}
.ttl{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
#heart{width:100%;height:auto;display:block;margin:6px 0 4px}
.valves{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:4px}
.vrow{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.vrow .vb{height:4px;border-radius:4px;background:rgba(255,255,255,.07);margin-top:4px;overflow:hidden}
.vrow .vb u{display:block;height:100%;width:0;background:var(--text);transition:width .04s}
.vrow em{font-style:normal;float:right;color:var(--dim)}
.vrow em.leak{color:var(--bad)} .vrow em.open{color:var(--ecg)}
.seal{position:absolute;inset:0;border-radius:var(--r);background:rgba(6,8,11,.86);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;text-align:center;padding:20px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);z-index:3}
.sealed .seal{display:flex}
.find{padding:16px 18px 18px}
.find h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;font-weight:500}
.find h4:first-child{margin-top:0}
.find p{font-size:14px;line-height:1.55;color:#cfd5dd}
.find .lk{border-left:2px solid var(--heart);padding:8px 12px;background:rgba(255,77,109,.06);border-radius:0 10px 10px 0;margin-top:8px;font-size:13.5px;line-height:1.55;color:#e3e7ec}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.kv dt{color:var(--muted);font-family:var(--mono);font-size:11.5px;padding-top:2px}
.kv dd{color:#dfe4ea}
.mur{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;background:rgba(255,182,72,.035)}
.mur b{font-weight:600;color:var(--pcg);font-size:13.5px}
.mur p{font-size:13px;margin-top:3px;color:#c9d0d8}
.casebar{border:1px solid rgba(124,196,255,.25);background:rgba(124,196,255,.06);border-radius:12px;padding:12px 14px;margin-bottom:6px}
.casebar .k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--sky);text-transform:uppercase}
.casebar .t{font-family:var(--serif);font-size:19px;margin:4px 0}
.casebar p{font-size:13.5px;color:#cfd8e2}
aside{display:grid;gap:16px;min-width:0}
.panel{padding:16px}
.sec{padding:14px 0;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0;padding-top:4px}
.sec h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:10px;display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.glab{font-size:11px;color:var(--dim);margin:2px 0 6px;font-family:var(--mono)}
.chip{border:1px solid var(--line2);border-radius:9px;padding:6px 10px;font-size:12.5px;color:#c3cad3;transition:.12s;background:rgba(255,255,255,.015)}
.chip:hover{border-color:rgba(255,255,255,.3);color:var(--text)}
.chip.on{background:var(--ecg);color:#04140c;border-color:var(--ecg);font-weight:600}
.sl{margin:10px 0 14px}
.sl .top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.sl .top span{color:#d5dbe2}
.sl output{font-family:var(--mono);font-size:12.5px;color:var(--text)}
.sl .st{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:2px;letter-spacing:.04em}
.sl .st.w{color:var(--pcg)} .sl .st.s{color:var(--bad)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin-top:4px}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--heart) var(--p,50%),rgba(255,255,255,.1) var(--p,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.1)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--heart)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;margin-top:-7px;box-shadow:0 0 0 4px rgba(255,77,109,.25)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff}
input[type=range]:disabled{opacity:.35}
.seg{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 6px;border-radius:7px;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:0 0 0 1px var(--line2)}
.tg{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#d5dbe2;padding:6px 0}
.sw{width:38px;height:22px;border-radius:22px;background:rgba(255,255,255,.12);position:relative;transition:.15s;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--heart)} .sw.on::after{left:19px}
.sitewrap{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center}
#torso{width:100%;height:auto}
#torso .dot{cursor:pointer}
#torso .dot circle.c{fill:rgba(255,255,255,.12);stroke:rgba(255,255,255,.4);transition:.15s}
#torso .dot.on circle.c{fill:var(--heart);stroke:#fff}
#torso .dot circle.ring{fill:none;stroke:var(--heart);opacity:0}
#torso .dot.on circle.ring{animation:ring 1.6s infinite}
@keyframes ring{0%{r:7;opacity:.8}100%{r:16;opacity:0}}
.sitename{font-size:13px;line-height:1.45;color:#d5dbe2}
.sitename small{display:block;color:var(--muted);font-size:11.5px;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 18px;font-weight:600;font-size:14.5px;background:var(--heart);color:#fff;transition:.15s;box-shadow:0 8px 30px rgba(255,77,109,.25)}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn.ghost{background:transparent;border:1px solid var(--line2);box-shadow:none;color:var(--text);font-weight:500}
.btn.full{width:100%}
.cases{display:grid;gap:8px}
.case{text-align:left;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:rgba(255,255,255,.015);transition:.15s}
.case:hover{border-color:var(--line2);background:rgba(255,255,255,.03)}
.case.on{border-color:var(--heart);background:rgba(255,77,109,.07)}
.case .ct{font-size:14px;font-weight:600}
.case .cs{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.case .tags{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.case .tags i{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;padding:2px 7px;border-radius:6px;background:rgba(60,245,160,.08);color:var(--ecg)}
.case .tags i.s{background:rgba(255,182,72,.09);color:var(--pcg)}
.exq h5{font-size:14px;font-weight:600;margin:14px 0 8px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:13.5px;color:#d5dbe2;transition:.12s}
.opt:hover:not(:disabled){border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.03)}
.opt.ok{border-color:var(--good);background:rgba(60,245,160,.10);color:#fff}
.opt.no{border-color:var(--bad);background:rgba(255,93,115,.10)}
.opt:disabled{cursor:default}
.prog{display:flex;gap:4px;margin:4px 0 12px}
.prog i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.08)}
.prog i.d{background:var(--text)} .prog i.c{background:var(--heart)}
.reveal{border-radius:12px;padding:12px 14px;background:rgba(255,255,255,.03);border:1px solid var(--line);margin-top:10px;font-size:13.5px;line-height:1.55;color:#d8dee5}
.reveal b{color:#fff}
.score{text-align:center;padding:10px 0}
.score .big{font-family:var(--serif);font-size:64px;line-height:1}
.score .big small{font-size:24px;color:var(--muted)}
.score .verdict{font-family:var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--heart);font-size:12px;margin:10px 0 14px}
.rl{font-size:13px;color:#cfd5dd;text-align:left;display:grid;gap:4px;margin-bottom:14px}
.muted{color:var(--muted);font-size:13px;line-height:1.5}
footer{margin-top:22px;color:var(--dim);font-size:12px;line-height:1.6;text-align:center}
footer b{color:var(--muted);font-weight:500}
.intro{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(800px 500px at 50% 40%,rgba(255,77,109,.14),transparent 70%),rgba(4,6,9,.94);backdrop-filter:blur(10px);transition:opacity .5s}
.intro.gone{opacity:0;pointer-events:none}
.intro .box{max-width:620px;text-align:center}
.intro .kick{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.intro h2{font-family:var(--serif);font-weight:600;font-size:clamp(52px,11vw,96px);line-height:.95;margin:14px 0 18px}
.intro p.lede{font-size:17px;line-height:1.6;color:#cdd4dc}
.intro ul{list-style:none;display:grid;gap:8px;margin:22px auto 26px;max-width:460px;text-align:left}
.intro li{font-size:14px;color:#c4ccd5;display:flex;gap:10px;align-items:flex-start}
.intro li::before{content:'';flex:none;width:7px;height:7px;border-radius:50%;background:var(--heart);margin-top:7px;box-shadow:0 0 10px var(--heart)}
.intro .note{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:14px;letter-spacing:.05em}
#introLine{width:100%;max-width:520px;height:60px;display:block;margin:0 auto}
@media(max-width:1100px){.grid{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}
@media(max-width:620px){.wrap{padding:10px 10px 30px}.brand h1{font-size:23px}nav.tabs{width:100%}nav.tabs button{flex:1;padding:8px 6px}.mon-head{padding:14px 14px 8px}.mon-head .rn{font-size:19px}.hr b{font-size:36px}.screen{margin:0 6px}.sitewrap{grid-template-columns:120px 1fr}}

/* ---------- Smart Heart 3.0 additions ---------- */
:root{--serif:'Fraunces','PT Serif',Georgia,serif}
.ver{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:#04140c;background:var(--ecg);border-radius:6px;padding:2px 6px;margin-left:8px;vertical-align:middle;font-style:normal;font-weight:700;position:relative;top:-3px}
.hdr-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lang{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.lang button{padding:6px 11px;border-radius:999px;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--muted);font-weight:500;transition:.15s}
.lang button:hover{color:var(--text)}
.lang button.on{background:var(--ecg);color:#04140c;font-weight:700}
.intro .lang{margin:0 auto 20px}
.intro .lang button{padding:7px 14px;font-size:12px}
/* glossary terms in running text */
.g{border-bottom:1px dotted rgba(124,196,255,.7);cursor:help;transition:color .12s,border-color .12s,background .12s;border-radius:2px}
.g:hover,.g:focus-visible,.g.tip-on{color:#fff;border-bottom-color:var(--sky);background:rgba(124,196,255,.12);outline:none}
.chip[data-g].tip-on,.seg button[data-g].tip-on{box-shadow:0 0 0 2px rgba(124,196,255,.45)}
/* tooltip */
#tip{position:fixed;left:0;top:0;z-index:200;width:max-content;max-width:min(340px,calc(100vw - 20px));background:#111821;border:1px solid rgba(124,196,255,.35);border-radius:14px;padding:12px 14px 11px;box-shadow:0 18px 50px rgba(0,0,0,.6);font-size:13px;line-height:1.5;color:#dfe5ec;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;pointer-events:none;visibility:hidden}
#tip.on{opacity:1;transform:none;visibility:visible}
#tip .th{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
#tip .tk{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--sky)}
#tip .tn{font-weight:600;color:#fff;font-size:13.5px}
#tip .tl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:8px 0 2px}
#tip p{margin:0}
#tip .tx{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);display:grid;gap:2px}
#tip .tx b{display:inline-block;min-width:22px;font-family:var(--mono);font-size:10px;color:var(--dim);font-weight:500}
/* monitor legend */
.legend{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:10px 16px 0;font-family:var(--mono);font-size:11px;color:var(--muted)}
.legend .lt{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-right:4px}
.legend span[data-g]{display:inline-flex;align-items:center;gap:5px;cursor:help;padding:3px 7px;border-radius:7px;border:1px solid transparent;transition:.12s}
.legend span[data-g]:hover,.legend span[data-g].tip-on{background:rgba(255,255,255,.05);border-color:var(--line2);color:#fff}
.legend i{width:7px;height:7px;border-radius:50%;display:inline-block}
.lane-lab span[data-g]{pointer-events:auto;cursor:help}
#heart [data-g]{cursor:help}
#heart text[data-g]:hover{fill:#fff}
.hr span[data-g]{cursor:help}
/* glossary tab */
.gq{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;color:var(--text);font:inherit;font-size:13.5px;margin:12px 0 2px}
.gq:focus{outline:none;border-color:var(--sky)}
.gcat{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--sky);margin:16px 0 8px}
.gi{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;background:rgba(255,255,255,.015);transition:.12s;cursor:default}
.gi.demo{cursor:pointer}
.gi:hover{border-color:var(--line2);background:rgba(255,255,255,.03)}
.gi.on{border-color:var(--ecg);background:rgba(60,245,160,.06)}
.gi .gh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.gi .gk{font-family:var(--mono);font-weight:700;color:var(--sky);font-size:13px}
.gi .gn{font-weight:600;font-size:13.5px;color:#fff}
.gi p{font-size:12.5px;color:#c9d0d8;line-height:1.5;margin-top:4px}
.gi p.gs{color:var(--muted)}
.gi .gx{font-size:11px;color:var(--dim);margin-top:5px}
.gi .go{font-family:var(--mono);font-size:10px;color:var(--ecg);letter-spacing:.08em;margin-top:6px;display:inline-block}
@media(min-width:1101px){#glist{max-height:min(66vh,760px);overflow:auto;padding-right:6px;margin-right:-6px;overscroll-behavior:contain}
  #glist::-webkit-scrollbar{width:6px}#glist::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:6px}}

<body>
<div class="intro" id="intro">
  <div class="box">
    <div class="lang" id="langIntro" role="group" aria-label="Language"></div>
    <div class="kick" id="iKick"></div>
    <h2>Smart <em>Heart</em></h2>
    <svg id="introLine" viewBox="0 0 520 60" fill="none"><path d="M0 34 H150 l10 -6 l10 6 H200 l8 6 l10 -36 l10 42 l8 -12 H300 q18 -14 36 0 H520" stroke="#3cf5a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/><circle cx="222" cy="52" r="3" fill="#ffb648"/><circle cx="318" cy="52" r="3" fill="#ffb648"/></svg>
    <p class="lede" id="iLede"></p>
    <ul id="iList"></ul>
    <button class="btn" id="go"><span id="goTxt"></span> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <div class="note" id="iNote"></div>
  </div>
</div>

<div class="wrap">
<header class="top">
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 40 40"><path d="M20 35 C8 26 3 19 3 12.5 C3 7.5 7 4 11.5 4 C15 4 18 6 20 9 C22 6 25 4 28.5 4 C33 4 37 7.5 37 12.5 C37 19 32 26 20 35Z" fill="rgba(255,77,109,.16)" stroke="#ff4d6d" stroke-width="1.6"/><path d="M6 19 H13 l2 -4 l3 9 l3 -13 l3 8 H34" fill="none" stroke="#3cf5a0" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <div><h1>Smart <em>Heart</em><span class="ver">3.0</span></h1><small id="tagline"></small></div>
  </div>
  <div class="hdr-r">
    <div class="lang" id="langTop" role="group" aria-label="Language"></div>
    <nav class="tabs" id="tabs">
      <button data-m="explore" class="on"></button>
      <button data-m="cases"></button>
      <button data-m="exam"></button>
      <button data-m="learn"></button>
    </nav>
    <a class="tdtab" href="teardown.html">Teardown <span aria-hidden="true">→</span></a>
    <a class="tdtab" href="game.html">The Game <span aria-hidden="true">→</span></a>
  </div>
</header>

<div class="grid">
<div class="left">
  <section class="card">
    <div class="mon-head">
      <div><div class="rn" id="rname"></div><div class="sub" id="rsub"></div></div>
      <div class="hr"><svg id="hicon" viewBox="0 0 24 24"><path d="M12 21C5 16 2 12 2 8.2 2 5.3 4.3 3 7.1 3c1.9 0 3.6 1 4.9 2.6C13.3 4 15 3 16.9 3 19.7 3 22 5.3 22 8.2 22 12 19 16 12 21Z" fill="#ff4d6d"/></svg><b id="hr">--</b><span id="bpm" data-g="bpm">BPM</span></div>
    </div>
    <div class="screen">
      <canvas id="cgrid"></canvas><canvas id="ctrace"></canvas>
      <div class="lane-lab e" id="elab"></div>
      <div class="lane-lab p" id="plab"></div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="mon-foot">
      <div class="cap" id="cap"></div>
      <div class="tools">
        <div class="breath" id="breath"><span id="btxt"></span><i><u id="bbar"></u></i></div>
        <button class="pill on" id="tLink"></button>
        <button class="pill" id="tFreeze"></button>
      </div>
    </div>
  </section>

  <div class="row2">
    <section class="card heart-card" id="heartCard">
      <div class="ttl"><span id="liveHeart"></span><span id="phase"></span></div>
      <svg id="heart" viewBox="0 0 260 252">
        <defs>
          <radialGradient id="gl" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#7cc4ff" stop-opacity=".9"/><stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/></radialGradient>
        </defs>
        <g id="atria">
          <rect id="ra" x="26" y="30" width="96" height="80" rx="24"/>
          <rect id="la" x="138" y="30" width="96" height="80" rx="24"/>
        </g>
        <g id="vent">
          <path id="rv" d="M26 128 H122 V214 Q110 242 82 238 Q34 228 26 186 Z"/>
          <path id="lv" d="M138 128 H234 Q242 196 214 228 Q184 254 138 238 Z"/>
        </g>
        <g id="cond" fill="none" stroke-width="2.4" stroke-linecap="round">
          <path id="intern" d="M44 46 Q90 70 130 118"/>
          <path id="his" data-g="his" d="M130 124 V150"/>
          <path id="rbb" data-g="his" d="M128 150 Q100 190 74 226"/>
          <path id="lbb" data-g="his" d="M132 150 Q170 186 196 228"/>
        </g>
        <circle id="sa" data-g="sa" cx="44" cy="46" r="6"/>
        <circle id="avn" data-g="avn" cx="130" cy="120" r="6"/>
        <g id="leaf" stroke-width="3.4" stroke-linecap="round">
          <line id="t1" x1="34" y1="120" x2="74" y2="120"/><line id="t2" x1="114" y1="120" x2="74" y2="120"/>
          <line id="m1" x1="146" y1="120" x2="186" y2="120"/><line id="m2" x1="226" y1="120" x2="186" y2="120"/>
        </g>
        <g font-family="JetBrains Mono" font-size="11" fill="rgba(233,237,242,.55)" letter-spacing="1" text-anchor="middle">
          <text id="tRA" data-g="ra" x="74" y="80"></text><text id="tLA" data-g="la" x="186" y="80"></text><text id="tRV" data-g="rv" x="74" y="186"></text><text id="tLV" data-g="lv" x="186" y="186"></text>
        </g>
      </svg>
      <div class="valves" id="valves"></div>
      <div class="seal" id="sealHeart"></div>
    </section>
    <section class="card find" id="find"><div class="seal" id="sealFind"></div><div id="findBody"></div></section>
  </div>
</div>

<aside>
  <section class="card panel">
    <div class="sec"><h3><span id="stethT"></span><span id="siteShort"></span></h3>
      <div class="sitewrap">
        <svg id="torso" viewBox="0 0 200 175">
          <path d="M62 10 Q100 24 138 10 Q172 16 184 44 L190 170 H10 L16 44 Q28 16 62 10Z" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.18)" stroke-width="1.2"/>
          <path d="M100 26 V122" stroke="rgba(255,255,255,.18)" stroke-width="5" stroke-linecap="round"/>
          <g stroke="rgba(255,255,255,.08)" fill="none" stroke-width="1.2"><path d="M30 46 Q60 40 96 50"/><path d="M104 50 Q140 40 170 46"/><path d="M26 70 Q60 62 96 72"/><path d="M104 72 Q140 62 174 70"/><path d="M24 94 Q60 86 96 96"/><path d="M104 96 Q140 86 176 94"/><path d="M24 118 Q60 110 96 120"/><path d="M104 120 Q140 110 176 118"/></g>
          <path d="M108 70 Q150 64 158 104 Q156 132 128 140 Q104 132 100 106 Z" fill="rgba(255,77,109,.10)" stroke="rgba(255,77,109,.35)"/>
          <g class="dot" data-s="aortic"><circle class="ring" cx="84" cy="58" r="7"/><circle class="c" cx="84" cy="58" r="7"/></g>
          <g class="dot" data-s="pulmonic"><circle class="ring" cx="116" cy="58" r="7"/><circle class="c" cx="116" cy="58" r="7"/></g>
          <g class="dot" data-s="erb"><circle class="ring" cx="112" cy="84" r="7"/><circle class="c" cx="112" cy="84" r="7"/></g>
          <g class="dot" data-s="tricuspid"><circle class="ring" cx="108" cy="110" r="7"/><circle class="c" cx="108" cy="110" r="7"/></g>
          <g class="dot" data-s="mitral"><circle class="ring" cx="150" cy="128" r="7"/><circle class="c" cx="150" cy="128" r="7"/></g>
        </svg>
        <div class="sitename" id="siteName"></div>
      </div>
      <div style="display:grid;gap:8px;margin-top:12px">
        <div class="seg" id="segPiece"><button data-v="diaphragm" data-g="diaphragm"></button><button data-v="bell" data-g="bell"></button></div>
        <div class="seg" id="segOut"><button data-v="headphones"></button><button data-v="speaker"></button></div>
      </div>
      <div class="tg" style="margin-top:6px"><span id="breathLbl"></span><button class="sw on" id="swBreath" aria-label="breathing"></button></div>
      <div class="sl" style="margin-bottom:0"><div class="top"><span id="volLbl"></span><output id="volOut">80%</output></div><input type="range" id="vol" min="0" max="100" value="80"></div>
    </div>
  </section>
  <section class="card panel" id="modePanel"></section>
</aside>
</div>

<footer id="foot"></footer>
</div>
<div id="tip" role="tooltip"></div>

  svt:{n:'Supraventricular tachycardia',s:'SVT',lab:'Rate',ecg:'Regular narrow-complex tachycardia, with P waves hidden in the QRS.',mech:'Diastole is almost as short as systole. S1 and S2 become evenly spaced, the "tic-tac" (embryocardia) rhythm.'},
  avb1:{n:'First-degree AV block',s:'1° AVB',lab:'Sinus rate',ecg:'Every P conducts, but the PR interval is fixed above 200 ms.',mech:'During the long PR the mitral leaflets float back toward closure before the ventricle fires, so they travel less distance and S1 is soft.'},
  wenck:{n:'Mobitz I (Wenckebach)',s:'Mobitz I',lab:'Atrial rate',ecg:'PR lengthens beat by beat until a P wave is not conducted, giving grouped beating.',mech:'As the PR stretches, S1 softens beat by beat. The dropped beat is a P wave with no QRS, no S1 and no S2: a pause you can hear.'},
  mobitz2:{n:'Mobitz II',s:'Mobitz II',lab:'Atrial rate',ecg:'Constant PR with sudden non-conducted P waves. The block sits below the AV node, so the QRS is usually wide: about 3 in 4 cases have a bundle branch block (shown here with RBBB).',mech:'S1 stays constant because the PR never changes, then a beat simply vanishes. The sudden silence is the danger sign.'},

  ms_sr:{t:'Mitral stenosis in sinus rhythm',story:'A 29-year-old woman, now breathless in the second trimester of pregnancy. Rheumatic fever in childhood.',sound:'Opening snap and diastolic rumble with presystolic accentuation',pearl:'Watch each P wave: right after it, the rumble swells into S1. That presystolic crescendo is atrial contraction you can hear, and it disappears the day she goes into AF.'},
  ms_af:{t:'Mitral stenosis in atrial fibrillation',story:'A 38-year-old woman with palpitations and breathlessness on the stairs. Rheumatic fever at age 9.',sound:'Opening snap and diastolic rumble without presystolic accentuation',pearl:'Same valve as the previous case, but AF has removed the atrial kick. The rumble fades through diastole with no crescendo, and S1 changes loudness with every irregular beat.'},
  as:{t:'Severe aortic stenosis',story:'A 74-year-old man with chest tightness and a faint while climbing stairs.',sound:'Late-peaking ejection murmur, soft A2 and S4',pearl:'Severity lives in timing, not loudness. The tighter the valve, the later the murmur peaks and the softer A2 becomes. The S4 is the atrium filling a stiff, hypertrophied ventricle.'},
  mr:{t:'Severe mitral regurgitation',story:'A 61-year-old, breathless, with the apex displaced to the anterior axillary line.',sound:'Holosystolic murmur with S3',pearl:'The murmur starts with S1 and buries A2, with no gap anywhere in systole. The S3 is regurgitant volume rushing back into the LV in early diastole.'},
  ar:{t:'Aortic regurgitation',story:'A tall 23-year-old with bounding pulses and a head that nods with each beat.',sound:'Early diastolic decrescendo murmur',pearl:'High-pitched, and it starts the instant A2 closes. Use the diaphragm with the patient sitting forward in held expiration. The extra systolic flow murmur is not AS; it is the extra stroke volume.'},
  mvp:{t:'Mitral valve prolapse',story:'A 22-year-old woman with palpitations and sharp chest pain unrelated to effort.',sound:'Mid-systolic click and late systolic murmur',pearl:'The click is the leaflet snapping as it billows back. Anything that shrinks the LV (standing, Valsalva) moves the click and murmur earlier.'},
  chb:{t:'Complete heart block',story:'An 81-year-old woman with two falls this week. Pulse 38 and regular.',sound:'Variable S1 with intermittent cannon sounds and random S4s',pearl:'The atria and ventricles have stopped talking. When a P lands just before a QRS, S1 booms. You can suspect AV dissociation with a stethoscope before you see the ECG.'},
  lbbb:{t:'Left bundle branch block',story:'A 67-year-old with long-standing hypertension. The GP flagged his ECG.',sound:'Paradoxical (reversed) splitting of S2',pearl:'The LV fires late, so A2 now follows P2. Inspiration delays P2 toward A2 and the split narrows, the opposite of normal.'},
  rbbb:{t:'Right bundle branch block',story:'A 45-year-old at a routine check-up, with no symptoms.',sound:'Wide splitting of S2 that widens on inspiration',pearl:'P2 is late on every beat, so the split never closes, but it still breathes. A split that does not move at all would point to an ASD instead.'},
  avb1:{t:'First-degree AV block',story:'A 58-year-old taking a beta-blocker and digoxin.',sound:'Soft S1',pearl:'With a long PR the mitral leaflets have drifted nearly shut before the ventricle contracts. A long PR means a soft S1.'},
  wpw:{t:'Wolff–Parkinson–White',story:'A 19-year-old with sudden episodes of a racing heart.',sound:'Loud S1',pearl:'The accessory pathway pre-excites the ventricle while the leaflets are still wide open, so they close from far away. A short PR means a loud S1.'},
  wenck:{t:'Mobitz I (Wenckebach)',story:'A 70-year-old on day 2 in the coronary care unit after an inferior MI.',sound:'S1 softening beat by beat, then a silent dropped beat',pearl:'Follow the PR on the trace and S1 on the audio together: the PR lengthens, S1 fades, then a P wave appears with nothing after it, and you hear the pause.'},
  vt:{t:'Ventricular tachycardia',story:'A 63-year-old, two weeks after a large anterior MI, now pale and sweaty.',sound:'Rapid regular sounds with variable S1 (AV dissociation)',pearl:'Sinus P waves still march through the VT. When one lands just before a ventricular beat, S1 changes intensity. Variable S1 in a wide-complex tachycardia supports VT over SVT with aberrancy.'},
  vf:{t:'Ventricular fibrillation',story:'Collapse in the hospital corridor. Unresponsive and not breathing normally.',sound:'No heart sounds at all',pearl:'Chaotic electricity and zero mechanics: nothing closes, so there is nothing to hear. Start CPR and defibrillate.'},

 rh:{
  nsr:{n:'Нормальный синусовый ритм',s:'Синус',lab:'Синусовая частота',ecg:'Зубец P перед каждым QRS, PR 120–200 мс, узкий QRS, ритм регулярный.',mech:'Каждый зубец P запускает сокращение предсердий. Примерно через 40 мс после QRS закрываются митральный и трикуспидальный клапаны (S1). В конце зубца T закрываются аортальный и лёгочный клапаны (S2).'},
  brady:{n:'Синусовая брадикардия',s:'Бради',lab:'Синусовая частота',ecg:'Нормальные синусовые комплексы с частотой ниже 60 в минуту.',mech:'Диастола удлиняется намного сильнее, чем систола. У S3, S4 и диастолических шумов появляется больше места, их легче различить.'},
  tachy:{n:'Синусовая тахикардия',s:'Тахи',lab:'Синусовая частота',ecg:'Синусовые комплексы с частотой выше 100 в минуту. Зубец P может приближаться к предыдущему T.',mech:'При высокой частоте укорачивается прежде всего диастола. S3 и S4 сближаются и могут слиться в суммационный галоп.'},
  af:{n:'Фибрилляция предсердий',s:'ФП',lab:'Средняя частота желудочков',ecg:'Зубцов P нет, на изолинии волны фибрилляции, интервалы RR абсолютно нерегулярны.',mech:'Предсердия не сокращаются, а «дрожат», поэтому S4 невозможен, а при митральном стенозе исчезает пресистолическое усиление. Громкость S1 меняется от удара к удару, потому что время наполнения каждый раз разное.'},
  flutter:{n:'Трепетание предсердий',s:'ТП',lab:'Частота желудочков (4:1 → 2:1)',ecg:'Пилообразные волны трепетания около 300 в минуту с фиксированным АВ-проведением.',mech:'Предсердия трепещут, а не сокращаются эффективно, поэтому S4 нет. При фиксированном проведении тоны остаются регулярными.'},
  svt:{n:'Наджелудочковая тахикардия',s:'НЖТ',lab:'Частота',ecg:'Регулярная тахикардия с узкими QRS, зубцы P скрыты в комплексе QRS.',mech:'Диастола почти равна систоле. S1 и S2 следуют через равные промежутки — маятникообразный ритм «тик-так» (эмбриокардия).'},
  avb1:{n:'АВ-блокада I степени',s:'АВБ I',lab:'Синусовая частота',ecg:'Каждый P проводится, но интервал PR постоянно больше 200 мс.',mech:'За долгий PR створки митрального клапана успевают «всплыть» к закрытию ещё до сокращения желудочка, проходят меньший путь — и S1 ослаблен.'},
  wenck:{n:'Мобиц I (Венкебах)',s:'Мобиц I',lab:'Частота предсердий',ecg:'PR удлиняется от удара к удару, пока один зубец P не будет проведён; возникают группы сокращений.',mech:'По мере удлинения PR S1 ослабевает от удара к удару. Выпавший удар — это зубец P без QRS, без S1 и без S2: пауза, которую слышно.'},
  mobitz2:{n:'Мобиц II',s:'Мобиц II',lab:'Частота предсердий',ecg:'Постоянный PR с внезапными непроведёнными зубцами P. Блок ниже АВ-узла, поэтому QRS обычно широкий: примерно в 3 из 4 случаев есть блокада ножки (здесь показана БПНПГ).',mech:'S1 не меняется, потому что PR постоянен, а потом удар просто исчезает. Внезапная тишина — тревожный признак.'},
  chb:{n:'Полная АВ-блокада (III степени)',s:'АВБ III',lab:'Частота выскальзывающего ритма',ecg:'Зубцы P и комплексы QRS идут независимо. Узловой выскальзывающий ритм (40–60/мин) даёт узкий QRS, желудочковый (меньше 40/мин) — широкий. При частоте ниже 45/мин тренажёр рисует широкий комплекс.',mech:'Предсердия и желудочки разобщены. Когда P попадает прямо перед QRS, S1 звучит очень громко («пушечный» тон Стражеско). S4 появляются там, где предсердия случайно сокращаются в диастолу.'},
  wpw:{n:'Синдром Вольфа–Паркинсона–Уайта',s:'WPW',lab:'Синусовая частота',ecg:'Короткий PR (меньше 120 мс), пологая дельта-волна и расширенный QRS.',mech:'Предвозбуждение запускает желудочек, пока створки митрального клапана ещё широко открыты. Они захлопываются издалека, поэтому S1 громкий.'},
  pvc:{n:'Синусовый ритм с желудочковыми экстрасистолами',s:'ЖЭС',lab:'Синусовая частота',ecg:'Преждевременный, широкий, деформированный QRS без зубца P, дискордантный T и полная компенсаторная пауза.',mech:'Внеочередной удар почти не успел наполниться, поэтому он слабый, и S2 может почти исчезнуть. После паузы следующий удар хорошо наполнен.'},
  lbbb:{n:'Блокада левой ножки пучка Гиса',s:'БЛНПГ',lab:'Синусовая частота',ecg:'QRS не менее 120 мс, дискордантный T. Это II отведение; классический широкий зазубренный R виден в I, aVL, V5–V6, глубокий S — в V1.',mech:'Левый желудочек активируется поздно, поэтому A2 следует после P2. Это парадоксальное расщепление: на выдохе оно шире, на вдохе уже.'},
  rbbb:{n:'Блокада правой ножки пучка Гиса',s:'БПНПГ',lab:'Синусовая частота',ecg:'QRS не менее 120 мс. Во II отведении — широкий конечный S; классический rSR′ виден в V1, зазубренный S — в I и V6.',mech:'Правый желудочек активируется поздно, поэтому P2 всегда запаздывает. Расщепление S2 широкое и на вдохе ещё больше расширяется.'},
  vt:{n:'Желудочковая тахикардия',s:'ЖТ',lab:'Частота',ecg:'Регулярная тахикардия с широкими QRS и независимыми зубцами P (АВ-диссоциация).',mech:'Синусовые P продолжают идти своим ходом. Когда P попадает прямо перед желудочковым сокращением, громкость S1 меняется. Переменный S1 при тахикардии с широкими QRS говорит в пользу ЖТ.'},
  vf:{n:'Фибрилляция желудочков',s:'ФЖ',ecg:'Хаотичные волны без различимых QRS.',mech:'Без согласованного сокращения ни один клапан не открывается и не закрывается — тонов сердца нет вовсе. Тишина плюс такая кривая — немедленно СЛР и дефибрилляция.'},
  asys:{n:'Асистолия',s:'Асистолия',ecg:'Прямая линия. Подтвердите в двух отведениях и проверьте усиление.',mech:'Нет ни электрической, ни механической активности — слушать нечего. Ритм не подлежит дефибрилляции: СЛР и адреналин.'}
 },

 cases:{
  normal:{t:'Здоровое сердце',story:'21 год, медосмотр перед спортом. Всё в порядке — это ваш эталон.',sound:'Нормальные S1 и S2 с физиологическим расщеплением',pearl:'В точке лёгочной артерии следите за S2 на кривой. Два его компонента расходятся на вдохе и сливаются на выдохе. Любое патологическое расщепление сравнивают с этим.'},
  ms_sr:{t:'Митральный стеноз при синусовом ритме',story:'Женщина 29 лет, во втором триместре беременности появилась одышка. В детстве перенесла ревматическую лихорадку.',sound:'Щелчок открытия и диастолический рокот с пресистолическим усилением',pearl:'Следите за каждым зубцом P: сразу после него рокот нарастает к S1. Это пресистолическое усиление — сокращение предсердий, которое можно услышать. Оно исчезнет в тот день, когда у неё начнётся ФП.'},
  ms_af:{t:'Митральный стеноз при фибрилляции предсердий',story:'Женщина 38 лет, сердцебиение и одышка на лестнице. Ревматическая лихорадка в 9 лет.',sound:'Щелчок открытия и диастолический рокот без пресистолического усиления',pearl:'Тот же клапан, что и в предыдущем случае, но ФП убрала предсердный толчок. Рокот угасает к концу диастолы без нарастания, а громкость S1 меняется с каждым нерегулярным ударом.'},
  as:{t:'Тяжёлый аортальный стеноз',story:'Мужчина 74 лет: сдавление в груди и обморок при подъёме по лестнице.',sound:'Систолический шум изгнания с поздним пиком, ослабленный A2 и S4',pearl:'Тяжесть определяется временем, а не громкостью. Чем уже клапан, тем позже пик шума и тем тише A2. S4 — это предсердие, наполняющее жёсткий гипертрофированный желудочек.'},
  mr:{t:'Тяжёлая митральная регургитация',story:'Пациент 61 года с одышкой, верхушечный толчок смещён к передней подмышечной линии.',sound:'Пансистолический шум и S3',pearl:'Шум начинается с S1 и поглощает A2, в систоле нет ни одного промежутка. S3 — это регургитирующий объём, устремляющийся обратно в ЛЖ в раннюю диастолу.'},
  ar:{t:'Аортальная регургитация',story:'Высокий юноша 23 лет со «скачущим» пульсом и покачиванием головы в такт сердцу.',sound:'Ранний диастолический убывающий шум',pearl:'Высокочастотный и начинается сразу, как закрывается A2. Слушайте мембраной, пациент сидит с наклоном вперёд и задерживает дыхание на выдохе. Дополнительный систолический шум — не стеноз, а увеличенный ударный объём.'},
  mvp:{t:'Пролапс митрального клапана',story:'Девушка 22 лет: сердцебиение и острая боль в груди, не связанная с нагрузкой.',sound:'Мезосистолический щелчок и поздний систолический шум',pearl:'Щелчок — это створка, резко натягивающаяся при выбухании. Всё, что уменьшает ЛЖ (вставание, проба Вальсальвы), сдвигает щелчок и шум раньше.'},
  chb:{t:'Полная АВ-блокада',story:'Женщина 81 года, дважды падала на этой неделе. Пульс 38, ритмичный.',sound:'Переменный S1 с периодическими «пушечными» тонами и беспорядочными S4',pearl:'Предсердия и желудочки перестали «разговаривать». Когда P попадает прямо перед QRS, S1 гремит. Заподозрить АВ-диссоциацию можно стетоскопом ещё до ЭКГ.'},
  lbbb:{t:'Блокада левой ножки пучка Гиса',story:'Мужчина 67 лет с многолетней гипертонией. Участковый врач обратил внимание на его ЭКГ.',sound:'Парадоксальное (обратное) расщепление S2',pearl:'ЛЖ возбуждается поздно, поэтому A2 теперь идёт после P2. На вдохе P2 смещается к A2 и расщепление сужается — противоположно норме.'},
  rbbb:{t:'Блокада правой ножки пучка Гиса',story:'Мужчина 45 лет на профосмотре, жалоб нет.',sound:'Широкое расщепление S2, увеличивающееся на вдохе',pearl:'P2 запаздывает в каждом ударе, поэтому расщепление никогда не закрывается, но всё ещё «дышит». Фиксированное, совсем неподвижное расщепление указывало бы на ДМПП.'},
  avb1:{t:'АВ-блокада I степени',story:'Пациент 58 лет принимает бета-блокатор и дигоксин.',sound:'Ослабленный S1',pearl:'При длинном PR створки митрального клапана почти закрываются ещё до сокращения желудочка. Длинный PR — тихий S1.'},
  wpw:{t:'Синдром WPW',story:'Юноша 19 лет с внезапными приступами учащённого сердцебиения.',sound:'Громкий S1',pearl:'Дополнительный путь возбуждает желудочек, пока створки ещё широко открыты, и они закрываются издалека. Короткий PR — громкий S1.'},
  wenck:{t:'Мобиц I (Венкебах)',story:'Пациент 70 лет, 2-е сутки в кардиореанимации после нижнего инфаркта миокарда.',sound:'S1 ослабевает от удара к удару, затем беззвучный выпавший удар',pearl:'Следите одновременно за PR на кривой и S1 в звуке: PR удлиняется, S1 затихает, затем появляется P, за которым ничего нет, — и вы слышите паузу.'},
  vt:{t:'Желудочковая тахикардия',story:'Пациент 63 лет, через две недели после обширного переднего ИМ, бледный и потный.',sound:'Частые регулярные тоны с переменным S1 (АВ-диссоциация)',pearl:'Синусовые P продолжают идти сквозь ЖТ. Когда P попадает прямо перед желудочковым сокращением, громкость S1 меняется. Переменный S1 при тахикардии с широкими QRS говорит в пользу ЖТ, а не НЖТ с аберрацией.'},
  vf:{t:'Фибрилляция желудочков',story:'Падение в больничном коридоре. Без сознания, нормального дыхания нет.',sound:'Тонов сердца нет вовсе',pearl:'Хаотичное электричество и ноль механики: ничего не закрывается — нечего слушать. Начинайте СЛР и дефибрилляцию.'},
  hf:{t:'Декомпенсированная сердечная недостаточность',story:'Пациент 68 лет с ишемической кардиомиопатией и ортопноэ. Пульс 112.',sound:'Ритм галопа с S3 и S4',pearl:'При такой частоте диастола короткая, S3 и S4 сближаются и могут слиться в один суммационный галоп. Снизьте частоту в «Обзоре» — и они снова разойдутся.'}
 },

 rh:{
  nsr:{n:'Normal sinus ritmi',s:'Sinus',lab:'Sinus chastotasi',ecg:'Har bir QRS oldidan P tishcha, PR 120–200 ms, tor QRS, ritm muntazam.',mech:'Har bir P tishcha boʻlmachalarni qisqartiradi. QRS dan taxminan 40 ms keyin mitral va trikuspidal klapanlar yopiladi (S1). T tishcha oxirida aortal va oʻpka arteriyasi klapanlari yopiladi (S2).'},
  brady:{n:'Sinus bradikardiyasi',s:'Bradi',lab:'Sinus chastotasi',ecg:'Daqiqasiga 60 dan kam normal sinus komplekslari.',mech:'Diastola sistolaga qaraganda ancha koʻproq uzayadi. S3, S4 va diastolik shovqinlarga koʻproq joy qoladi, ularni ajratish osonlashadi.'},
  tachy:{n:'Sinus taxikardiyasi',s:'Taxi',lab:'Sinus chastotasi',ecg:'Daqiqasiga 100 dan ortiq sinus komplekslari. P tishcha oldingi T ga yaqinlashishi mumkin.',mech:'Tez ritmda eng avvalo diastola qisqaradi. S3 va S4 bir-biriga yaqinlashib, summatsion galopga qoʻshilib ketishi mumkin.'},
  af:{n:'Boʻlmachalar fibrillyatsiyasi',s:'AF',lab:'Qorinchalarning oʻrtacha chastotasi',ecg:'P tishchalar yoʻq, izoliniyada fibrillyatsiya toʻlqinlari, RR oraliqlari mutlaqo notekis.',mech:'Boʻlmachalar qisqarmaydi, faqat titraydi, shuning uchun S4 boʻlishi mumkin emas, mitral stenozda esa presistolik kuchayish yoʻqoladi. Har bir zarbada toʻlish vaqti har xil boʻlgani uchun S1 balandligi ham oʻzgarib turadi.'},
  flutter:{n:'Boʻlmachalar titrashi',s:'Flutter',lab:'Qorinchalar chastotasi (4:1 → 2:1)',ecg:'Daqiqasiga ~300 ta arrasimon titrash toʻlqinlari, AV oʻtkazuvchanlik barqaror.',mech:'Boʻlmachalar samarali qisqarmay titraydi, shuning uchun S4 yoʻq. Oʻtkazuvchanlik barqaror boʻlsa, tonlar muntazam qoladi.'},
  svt:{n:'Supraventrikulyar taxikardiya',s:'SVT',lab:'Chastota',ecg:'Tor QRS li muntazam taxikardiya, P tishchalar QRS ichida yashiringan.',mech:'Diastola deyarli sistolaga teng. S1 va S2 bir xil oraliqda eshitiladi — mayatniksimon «tik-tak» ritm (embriokardiya).'},
  avb1:{n:'I darajali AV blokada',s:'1° AVB',lab:'Sinus chastotasi',ecg:'Har bir P oʻtkaziladi, lekin PR oraligʻi doimo 200 ms dan uzun.',mech:'PR uzun boʻlganda mitral klapan tavaqalari qorincha qisqarguncha yopilishga yaqinlashib qoladi, kamroq yoʻl bosadi — S1 sust eshitiladi.'},
  wenck:{n:'Mobits I (Venkebax)',s:'Mobits I',lab:'Boʻlmachalar chastotasi',ecg:'PR har zarbada uzayib boradi, oxiri bitta P oʻtkazilmaydi — guruhli zarbalar hosil boʻladi.',mech:'PR uzaygan sari S1 zarbadan zarbaga susayadi. Tushib qolgan zarba — QRS siz, S1 va S2 siz P tishcha: eshitiladigan pauza.'},
  mobitz2:{n:'Mobits II',s:'Mobits II',lab:'Boʻlmachalar chastotasi',ecg:'PR doimiy, lekin toʻsatdan oʻtkazilmagan P tishchalar paydo boʻladi. Blok AV tugundan pastda, shuning uchun QRS odatda keng: taxminan 4 holatdan 3 tasida oyoqcha blokadasi bor (bu yerda RBBB bilan).',mech:'PR oʻzgarmagani uchun S1 ham bir xil, keyin esa zarba shunchaki yoʻqoladi. Toʻsatdan jimlik — xavf belgisi.'},
  chb:{n:'Toʻliq AV blokada (III daraja)',s:'3° AVB',lab:'Sirpanuvchi ritm chastotasi',ecg:'P tishchalar va QRS komplekslari mustaqil yuradi. Tugun sirpanuvchi ritmi (40–60/daq) tor QRS beradi, qorincha ritmi (40/daq dan kam) — keng. 45/daq dan past chastotada trenajyor keng kompleks chizadi.',mech:'Boʻlmachalar va qorinchalar ajralib qolgan. P tishcha QRS dan sal oldin tushsa, S1 juda baland eshitiladi (Strajesko «toʻp» toni). Boʻlmachalar diastolada tasodifan qisqargan joyda S4 paydo boʻladi.'},
  wpw:{n:'Volf–Parkinson–Uayt sindromi',s:'WPW',lab:'Sinus chastotasi',ecg:'Qisqa PR (120 ms dan kam), qiya delta-toʻlqin va kengaygan QRS.',mech:'Erta qoʻzgʻalish qorinchani mitral tavaqalar hali keng ochiq paytda ishga tushiradi. Ular uzoqdan qarsillab yopiladi, shuning uchun S1 baland.'},
  pvc:{n:'Qorincha ekstrasistolalari bilan sinus ritmi',s:'PVC',lab:'Sinus chastotasi',ecg:'Muddatidan oldin keladigan, keng, shakli buzilgan QRS, oldida P yoʻq, T diskordant, toʻliq kompensator pauza.',mech:'Navbatdan tashqari zarba deyarli toʻlmagan, shuning uchun u kuchsiz va S2 deyarli yoʻqolishi mumkin. Pauzadan keyingi zarba yaxshi toʻladi.'},
  lbbb:{n:'Gis tutami chap oyoqchasi blokadasi',s:'LBBB',lab:'Sinus chastotasi',ecg:'QRS kamida 120 ms, diskordant T. Bu II tarmoq; klassik keng, tishli R I, aVL, V5–V6 da, chuqur S esa V1 da koʻrinadi.',mech:'Chap qorincha kech qoʻzgʻaladi, shuning uchun A2 P2 dan keyin keladi. Bu paradoksal ajralish: nafas chiqarishda kengroq, nafas olishda torayadi.'},
  rbbb:{n:'Gis tutami oʻng oyoqchasi blokadasi',s:'RBBB',lab:'Sinus chastotasi',ecg:'QRS kamida 120 ms. II tarmoqda keng yakuniy S tishcha; klassik rSR′ V1 da, I va V6 da esa keng S koʻrinadi.',mech:'Oʻng qorincha kech qoʻzgʻaladi, shuning uchun P2 doim kechikadi. S2 ajralishi keng va nafas olishda yanada kengayadi.'},
  vt:{n:'Qorinchalar taxikardiyasi',s:'VT',lab:'Chastota',ecg:'Keng QRS li muntazam taxikardiya, P tishchalar mustaqil (AV dissotsiatsiya).',mech:'Sinus P tishchalari oʻz yoʻlida davom etadi. P qorincha zarbasidan sal oldin tushsa, S1 balandligi oʻzgaradi. Keng QRS li taxikardiyada oʻzgaruvchan S1 qorinchalar taxikardiyasi foydasiga dalolat qiladi.'},
  vf:{n:'Qorinchalar fibrillyatsiyasi',s:'VF',ecg:'Aniq QRS siz tartibsiz toʻlqinlar.',mech:'Muvofiqlashgan qisqarish boʻlmasa, birorta klapan ochilmaydi ham, yopilmaydi ham — yurak tonlari umuman yoʻq. Jimlik va shunday egri chiziq — darhol YOʻR va defibrillyatsiya.'},

 cases:{
  normal:{t:'Sogʻlom yurak',story:'21 yoshli yigit, sport oldidan tibbiy koʻrik. Hech qanday muammo yoʻq — bu sizning andozangiz.',sound:'Fiziologik ajralishli normal S1 va S2',pearl:'Oʻpka arteriyasi nuqtasida egri chiziqdagi S2 ni kuzating. Uning ikki komponenti nafas olishda ajraladi, nafas chiqarishda qoʻshiladi. Har qanday patologik ajralish shunga solishtiriladi.'},
  ms_sr:{t:'Sinus ritmida mitral stenoz',story:'29 yoshli ayol, homiladorlikning ikkinchi trimestrida hansirash paydo boʻlgan. Bolaligida revmatik isitma oʻtkazgan.',sound:'Ochilish toni va presistolik kuchayishli diastolik gʻurillash',pearl:'Har bir P tishchani kuzating: undan keyin gʻurillash S1 tomon kuchayadi. Bu presistolik kuchayish — eshitsa boʻladigan boʻlmachalar qisqarishi. Unda boʻlmachalar fibrillyatsiyasi boshlangan kuni u yoʻqoladi.'},
  ms_af:{t:'Boʻlmachalar fibrillyatsiyasida mitral stenoz',story:'38 yoshli ayol, yurak urib ketishi va zinadan chiqqanda hansirash. 9 yoshida revmatik isitma.',sound:'Ochilish toni va presistolik kuchayishsiz diastolik gʻurillash',pearl:'Oldingi holatdagi klapanning oʻzi, lekin fibrillyatsiya boʻlmacha turtkisini yoʻq qildi. Gʻurillash diastola davomida kuchaymasdan soʻnadi, S1 balandligi esa har bir notekis zarbada oʻzgaradi.'},
  as:{t:'Ogʻir aortal stenoz',story:'74 yoshli erkak, zinaga chiqayotganda koʻkrakdagi siqilish va hushdan ketish.',sound:'Kech choʻqqili sistolik haydash shovqini, sust A2 va S4',pearl:'Ogʻirlik balandlikda emas, vaqtda. Klapan qanchalik tor boʻlsa, shovqin shunchalik kech choʻqqiga chiqadi va A2 shunchalik sustlashadi. S4 — qattiq, gipertrofiyalangan qorinchani toʻldirayotgan boʻlmacha.'},
  mr:{t:'Ogʻir mitral regurgitatsiya',story:'61 yoshli bemor, hansiraydi, choʻqqi turtkisi oldingi qoʻltiq osti chizigʻigacha siljigan.',sound:'Golosistolik shovqin va S3',pearl:'Shovqin S1 bilan boshlanadi va A2 ni yutib yuboradi, sistolada hech qanday boʻshliq yoʻq. S3 — erta diastolada chap qorinchaga qaytib otilayotgan regurgitatsiya hajmi.'},
  ar:{t:'Aortal regurgitatsiya',story:'23 yoshli baland boʻyli yigit, sakrovchi puls, har zarbada boshi qimirlaydi.',sound:'Erta diastolik pasayuvchi shovqin',pearl:'Yuqori chastotali va A2 yopilishi bilan darhol boshlanadi. Membrana bilan, bemor oldinga engashib, nafas chiqarib ushlab turgan holda eshiting. Qoʻshimcha sistolik shovqin stenoz emas — bu ortiqcha zarb hajmi.'},
  mvp:{t:'Mitral klapan prolapsi',story:'22 yoshli qiz, yurak urib ketishi va yuklama bilan bogʻliq boʻlmagan oʻtkir koʻkrak ogʻrigʻi.',sound:'Mezosistolik klik va kech sistolik shovqin',pearl:'Klik — orqaga boʻrtib chiqqan tavaqaning keskin taranglashishi. Chap qorinchani kichraytiradigan har narsa (tik turish, Valsalva sinovi) klik va shovqinni oldinroqqa suradi.'},
  chb:{t:'Toʻliq AV blokada',story:'81 yoshli ayol, shu hafta ikki marta yiqilgan. Puls 38, muntazam.',sound:'Oʻzgaruvchan S1, vaqti-vaqti bilan «toʻp» tonlari va tartibsiz S4',pearl:'Boʻlmachalar va qorinchalar «gaplashishni» toʻxtatgan. P tishcha QRS dan sal oldin tushsa, S1 gumburlaydi. AV dissotsiatsiyani EKG dan oldin ham stetoskop bilan gumon qilish mumkin.'},
  lbbb:{t:'Gis tutami chap oyoqchasi blokadasi',story:'67 yoshli erkak, uzoq yillik gipertoniya. Oilaviy shifokor uning EKG siga eʼtibor qaratgan.',sound:'S2 ning paradoksal (teskari) ajralishi',pearl:'Chap qorincha kech qoʻzgʻaladi, shuning uchun A2 endi P2 dan keyin keladi. Nafas olishda P2 A2 tomon suriladi va ajralish torayadi — normaga teskari.'},
  rbbb:{t:'Gis tutami oʻng oyoqchasi blokadasi',story:'45 yoshli erkak, muntazam koʻrikda, shikoyati yoʻq.',sound:'Nafas olishda kengayadigan keng S2 ajralishi',pearl:'P2 har bir zarbada kechikadi, shuning uchun ajralish hech qachon yopilmaydi, lekin baribir «nafas oladi». Umuman qimirlamaydigan ajralish boʻlmachalararo toʻsiq nuqsonini koʻrsatgan boʻlardi.'},
  avb1:{t:'I darajali AV blokada',story:'58 yoshli bemor beta-blokator va digoksin qabul qiladi.',sound:'Sust S1',pearl:'PR uzun boʻlganda mitral tavaqalar qorincha qisqarguncha deyarli yopilib boʻladi. Uzun PR — sust S1.'},
  wpw:{t:'WPW sindromi',story:'19 yoshli yigit, toʻsatdan yurak tez urib ketish xurujlari.',sound:'Baland S1',pearl:'Qoʻshimcha yoʻl qorinchani tavaqalar hali keng ochiq paytda qoʻzgʻatadi, ular uzoqdan yopiladi. Qisqa PR — baland S1.'},
  wenck:{t:'Mobits I (Venkebax)',story:'70 yoshli bemor, pastki miokard infarktidan keyin kardioreanimatsiyada 2-kun.',sound:'S1 zarbadan zarbaga susayadi, soʻng ovozsiz tushib qolgan zarba',pearl:'Egri chiziqdagi PR va tovushdagi S1 ni birga kuzating: PR uzayadi, S1 soʻnadi, keyin ortidan hech narsa kelmaydigan P paydo boʻladi — va siz pauzani eshitasiz.'},
  vt:{t:'Qorinchalar taxikardiyasi',story:'63 yoshli bemor, katta oldingi miokard infarktidan ikki hafta oʻtib, rangi oqargan va terlagan.',sound:'Oʻzgaruvchan S1 li tez muntazam tonlar (AV dissotsiatsiya)',pearl:'Sinus P tishchalari taxikardiya davomida ham yuraveradi. P qorincha zarbasidan sal oldin tushsa, S1 kuchi oʻzgaradi. Keng QRS li taxikardiyada oʻzgaruvchan S1 aberratsiyali SVT emas, balki qorinchalar taxikardiyasi foydasiga dalolat qiladi.'},
  vf:{t:'Qorinchalar fibrillyatsiyasi',story:'Kasalxona yoʻlagida yiqilib tushgan. Hushsiz, normal nafas olmayapti.',sound:'Yurak tonlari umuman yoʻq',pearl:'Tartibsiz elektr va nol mexanika: hech narsa yopilmaydi, demak eshitadigan narsa yoʻq. YOʻR ni boshlang va defibrillyatsiya qiling.'},
  hf:{t:'Dekompensatsiyalangan yurak yetishmovchiligi',story:'68 yoshli bemor, ishemik kardiomiopatiya va ortopnoe. Puls 112.',sound:'S3 va S4 bilan galop ritmi',pearl:'Bu chastotada diastola qisqa, S3 va S4 yaqinlashib, bitta summatsion galopga qoʻshilib ketishi mumkin. «Oʻrganish» boʻlimida chastotani pasaytiring — ular yana ajraladi.'}
