{k:'nsr',c:'rhythm',rh:'nsr',a:['NSR'],w:{en:['normal sinus rhythm'],ru:['нормальн* синусов* ритм*'],uz:['normal sinus ritm*']},
 d:{en:"The normal heartbeat: the sinus node, the heart's natural pacemaker, starts every beat, 60–100 times a minute.",ru:'Нормальный ритм сердца: каждый удар запускает синусовый узел — естественный водитель ритма — 60–100 раз в минуту.',uz:'Yurakning normal ritmi: har bir zarbani sinus tuguni — tabiiy ritm boshqaruvchisi — daqiqasiga 60–100 marta ishga tushiradi.'}},
{k:'brady',c:'rhythm',rh:'brady',a:[],w:{en:['sinus bradycardia','bradycardia'],ru:['синусов* брадикарди*','брадикарди*'],uz:['sinus bradikardiya*','bradikardiya*']},
 d:{en:'A sinus rhythm slower than 60 beats per minute. Normal in athletes and during sleep.',ru:'Синусовый ритм медленнее 60 ударов в минуту. Норма у спортсменов и во сне.',uz:'Daqiqasiga 60 zarbadan sekin sinus ritmi. Sportchilarda va uyquda normal.'}},
{k:'tachy',c:'rhythm',rh:'tachy',a:[],w:{en:['sinus tachycardia'],ru:['синусов* тахикарди*'],uz:['sinus taxikardiya*']},
 d:{en:'A sinus rhythm faster than 100 beats per minute: the normal response to exercise, fever, fear or blood loss.',ru:'Синусовый ритм чаще 100 ударов в минуту: нормальная реакция на нагрузку, лихорадку, страх или кровопотерю.',uz:'Daqiqasiga 100 zarbadan tez sinus ritmi: jismoniy yuklama, isitma, qoʻrquv yoki qon yoʻqotishga normal javob.'}},
{k:'af',c:'rhythm',rh:'af',a:['AF','ФП'],w:{en:['atrial fibrillation'],ru:['фибрилляци* предсерди*'],uz:['boʻlmachalar fibrillyatsiya*']},
 d:{en:'The atria stop beating and only quiver chaotically. The ventricles respond at random, so the pulse is irregularly irregular.',ru:'Предсердия перестают сокращаться и лишь хаотично «дрожат». Желудочки отвечают случайно, поэтому пульс абсолютно неритмичный.',uz:'Boʻlmachalar qisqarishni toʻxtatib, faqat tartibsiz titraydi. Qorinchalar tasodifiy javob beradi, shuning uchun puls mutlaqo notekis.'}},
{k:'flutter',c:'rhythm',rh:'flutter',a:['ТП','Flutter'],w:{en:['atrial flutter'],ru:['трепетани* предсерди*'],uz:['boʻlmachalar titrash*']},
 d:{en:'One fast electrical circuit loops around the right atrium about 300 times a minute. The AV node lets only every 2nd–4th wave through.',ru:'Один быстрый электрический круг вращается в правом предсердии около 300 раз в минуту. АВ-узел пропускает лишь каждую 2–4-ю волну.',uz:'Bitta tez elektr halqasi oʻng boʻlmachada daqiqasiga ~300 marta aylanadi. AV tugun faqat har 2–4-toʻlqinni oʻtkazadi.'}},
{k:'svt',c:'rhythm',rh:'svt',a:['SVT','НЖТ'],w:{en:['supraventricular tachycardia'],ru:['наджелудочков* тахикарди*'],uz:['supraventrikulyar taxikardiya*']},
 d:{en:'A fast, regular rhythm that starts above the ventricles, usually a short circuit in or right next to the AV node.',ru:'Частый регулярный ритм, возникающий выше желудочков, — обычно «короткое замыкание» в АВ-узле или рядом с ним.',uz:'Qorinchalardan yuqorida boshlanadigan tez, muntazam ritm — odatda AV tugun ichida yoki yonida «qisqa tutashuv».'}},
{k:'avb1',c:'rhythm',rh:'avb1',a:['1° AVB','АВБ I'],w:{en:['first-degree av block'],ru:['ав-блокад* i степени'],uz:['i darajali av blokada*']},
 d:{en:'Every signal from the atria reaches the ventricles, just slowly: the PR interval is longer than 200 ms. Usually harmless.',ru:'Каждый импульс из предсердий доходит до желудочков, но медленно: интервал PR длиннее 200 мс. Обычно безопасна.',uz:'Boʻlmachalardan har bir impuls qorinchalarga yetib boradi, lekin sekin: PR oraligʻi 200 ms dan uzun. Odatda xavfsiz.'}},
{k:'wenck',c:'rhythm',rh:'wenck',a:['Mobitz I','Мобиц I','Mobits I'],w:{en:['wenckebach'],ru:['венкебах*'],uz:['venkebax*']},
 d:{en:'Second-degree AV block, type I: the PR gets longer with each beat until one P wave fails to conduct, then the cycle restarts.',ru:'АВ-блокада II степени, тип I: PR удлиняется с каждым ударом, пока один зубец P не будет проведён, затем цикл начинается заново.',uz:'II darajali AV blokada, I tur: PR har zarbada uzayib boradi, oxiri bitta P oʻtkazilmaydi, soʻng sikl qaytadan boshlanadi.'}},
{k:'mobitz2',c:'rhythm',rh:'mobitz2',a:['Mobitz II','Мобиц II','Mobits II'],w:{en:[],ru:[],uz:[]},
 d:{en:'Second-degree AV block, type II: the PR stays the same, then a P wave suddenly fails to conduct. It can jump to complete block, so it is dangerous.',ru:'АВ-блокада II степени, тип II: PR не меняется, а затем зубец P внезапно не проводится. Может перейти в полную блокаду, поэтому опасна.',uz:'II darajali AV blokada, II tur: PR oʻzgarmaydi, soʻng P tishcha toʻsatdan oʻtkazilmaydi. Toʻliq blokadaga oʻtishi mumkin, shuning uchun xavfli.'}},
{k:'chb',c:'rhythm',rh:'chb',a:['3° AVB','АВБ III'],w:{en:['complete heart block'],ru:['полн* ав-блокад*'],uz:['toʻliq av blokada*']},
 d:{en:'No signal crosses from the atria to the ventricles. A backup pacemaker below the block keeps the ventricles beating slowly on their own.',ru:'Ни один импульс не проходит из предсердий в желудочки. Запасной водитель ритма ниже блока заставляет желудочки медленно сокращаться самостоятельно.',uz:'Boʻlmachalardan qorinchalarga birorta ham impuls oʻtmaydi. Blokadadan pastdagi zaxira ritm boshqaruvchisi qorinchalarni oʻzicha sekin qisqartiradi.'}},
{k:'wpw',c:'rhythm',rh:'wpw',a:['WPW'],w:{en:['wolff–parkinson–white'],ru:['вольфа–паркинсона–уайта'],uz:['volf–parkinson–uayt']},
 d:{en:'An extra electrical wire (accessory pathway) joins atria and ventricles, bypassing the AV node, so the ventricles start early.',ru:'Дополнительный «провод» (добавочный путь) соединяет предсердия и желудочки в обход АВ-узла, поэтому желудочки возбуждаются раньше.',uz:'Qoʻshimcha elektr «sim» (qoʻshimcha yoʻl) AV tugunni chetlab boʻlmacha va qorinchalarni bogʻlaydi, shuning uchun qorinchalar erta qoʻzgʻaladi.'}},
{k:'pvc',c:'rhythm',rh:'pvc',a:['PVCs','PVC','ЖЭС'],w:{en:['premature ventricular'],ru:['экстрасистол*'],uz:['ekstrasistol*']},
 d:{en:'Premature ventricular contraction: an extra beat fired early by the ventricle itself, not by the sinus node.',ru:'Желудочковая экстрасистола: внеочередное сокращение, запущенное раньше времени самим желудочком, а не синусовым узлом.',uz:'Qorincha ekstrasistolasi: sinus tugunidan emas, qorinchaning oʻzidan muddatidan oldin chiqqan qoʻshimcha zarba.'}},
{k:'lbbb',c:'rhythm',rh:'lbbb',a:['LBBB','БЛНПГ'],w:{en:['left bundle branch block'],ru:['блокад* левой ножки*'],uz:['gis tutami chap oyoqchasi*']},
 d:{en:"The left branch of the heart's wiring is blocked, so the left ventricle is activated late and slowly, through the right side.",ru:'Левая ветвь проводящей системы заблокирована, поэтому левый желудочек возбуждается поздно и медленно — «через» правый.',uz:'Yurak oʻtkazuvchi tizimining chap tarmogʻi toʻsilgan, shuning uchun chap qorincha kech va sekin, oʻng tomon orqali qoʻzgʻaladi.'}},
{k:'rbbb',c:'rhythm',rh:'rbbb',a:['RBBB','БПНПГ'],w:{en:['right bundle branch block'],ru:['блокад* правой ножки*'],uz:['gis tutami oʻng oyoqchasi*']},
 d:{en:"The right branch of the heart's wiring is blocked, so the right ventricle is activated late. Can be normal in healthy people.",ru:'Правая ветвь проводящей системы заблокирована, поэтому правый желудочек возбуждается поздно. Бывает и у здоровых людей.',uz:'Oʻtkazuvchi tizimning oʻng tarmogʻi toʻsilgan, shuning uchun oʻng qorincha kech qoʻzgʻaladi. Sogʻlom odamlarda ham uchrashi mumkin.'}},
{k:'vt',c:'rhythm',rh:'vt',a:['VT','ЖТ'],w:{en:['ventricular tachycardia'],ru:['желудочков* тахикарди*'],uz:['qorinchalar taxikardiya*']},
 d:{en:'A fast rhythm generated inside the ventricles, often around an old scar. Wide QRS. It can collapse into VF.',ru:'Частый ритм, возникающий в самих желудочках, часто вокруг старого рубца. Широкий QRS. Может перейти в ФЖ.',uz:'Qorinchalarning oʻzida, koʻpincha eski chandiq atrofida paydo boʻladigan tez ritm. QRS keng. Qorinchalar fibrillyatsiyasiga oʻtishi mumkin.'}},
{k:'vf',c:'rhythm',rh:'vf',a:['VF','ФЖ'],w:{en:['ventricular fibrillation'],ru:['фибрилляци* желудоч*'],uz:['qorinchalar fibrillyatsiya*']},
 d:{en:'Cardiac arrest: the ventricles only quiver, pump no blood, and the patient has no pulse.',ru:'Остановка сердца: желудочки лишь хаотично подёргиваются, кровь не перекачивается, пульса нет.',uz:'Yurak toʻxtashi: qorinchalar faqat titraydi, qon haydalmaydi, puls yoʻq.'}},
{k:'asys',c:'rhythm',rh:'asys',a:[],w:{en:['asystole'],ru:['асистоли*'],uz:['asistoliya*']},
 d:{en:'A flat line: no electrical activity at all. A cardiac arrest that a shock cannot fix.',ru:'Прямая линия: электрической активности нет совсем. Остановка сердца, которую нельзя устранить разрядом.',uz:'Toʻgʻri chiziq: elektr faollik umuman yoʻq. Elektr zarbasi bilan tuzatib boʻlmaydigan yurak toʻxtashi.'}},

/* ---------- Reading the ECG ---------- */
{k:'ecg',c:'ecg',a:['ECG','ЭКГ','EKG'],w:{en:[],ru:[],uz:[]},
 n:{en:'Electrocardiogram',ru:'Электрокардиограмма',uz:'Elektrokardiogramma'},
 d:{en:"A recording of the heart's electrical activity from electrodes on the skin. Here it is the green trace.",ru:'Запись электрической активности сердца с кожных электродов. Здесь это зелёная кривая.',uz:'Teridagi elektrodlardan yozib olingan yurak elektr faolligi. Bu yerda — yashil egri chiziq.'},
 s:{en:'At 25 mm/s one small square = 40 ms and one big square = 200 ms.',ru:'При 25 мм/с одна малая клетка = 40 мс, одна большая = 200 мс.',uz:'25 mm/s da bitta kichik katak = 40 ms, bitta katta katak = 200 ms.'}},
{k:'pcg',c:'ecg',a:['PCG','ФКГ','FKG'],w:{en:['phonocardiogram'],ru:['фонокардиограмм*'],uz:['fonokardiogramma*']},
 n:{en:'Phonocardiogram',ru:'Фонокардиограмма',uz:'Fonokardiogramma'},
 d:{en:'A picture of the heart sounds: how loud the sound is at each moment. Here it is the amber trace under the ECG.',ru:'Изображение звуков сердца: громкость в каждый момент времени. Здесь это янтарная кривая под ЭКГ.',uz:'Yurak tovushlarining tasviri: har lahzadagi balandligi. Bu yerda — EKG ostidagi sariq egri chiziq.'},
 s:{en:'Tall bursts are S1 and S2. A long fuzzy band between them is a murmur.',ru:'Высокие всплески — S1 и S2. Длинная «размытая» полоса между ними — шум.',uz:'Baland chaqnashlar — S1 va S2. Ular orasidagi uzun «xira» tasma — shovqin.'}},
{k:'lead2',c:'ecg',a:['Lead II'],w:{en:[],ru:['ii отведени*'],uz:['ii tarmoq']},
 n:{en:'Lead II',ru:'II стандартное отведение',uz:'II standart tarmoq'},
 d:{en:"One camera angle on the heart's electricity, from right arm to left leg. It runs along the normal path of the impulse, so P and QRS point upward.",ru:'Один «ракурс» на электричество сердца — от правой руки к левой ноге. Он идёт вдоль нормального пути импульса, поэтому P и QRS направлены вверх.',uz:'Yurak elektriga bitta «kamera burchagi» — oʻng qoʻldan chap oyoqqa. U impulsning normal yoʻli boʻylab ketadi, shuning uchun P va QRS yuqoriga qaragan.'}},
{k:'speed',c:'ecg',a:['25 mm/s','25 мм/с'],w:{en:[],ru:[],uz:[]},
 n:{en:'Paper speed',ru:'Скорость записи',uz:'Yozuv tezligi'},
 d:{en:'How fast the trace moves across the screen. The standard is 25 mm per second.',ru:'Как быстро кривая движется по экрану. Стандарт — 25 мм в секунду.',uz:'Egri chiziq ekranda qanchalik tez harakatlanishi. Standart — sekundiga 25 mm.'},
 s:{en:'Rate shortcut: 300 ÷ number of big squares between two R waves.',ru:'Быстрый счёт ЧСС: 300 ÷ число больших клеток между двумя зубцами R.',uz:'Chastotani tez hisoblash: 300 ÷ ikki R tishcha orasidagi katta kataklar soni.'}},
{k:'bpm',c:'ecg',a:['BPM','уд/мин','zarba/daq'],w:{en:['beats per minute'],ru:[],uz:[]},
 n:{en:'Beats per minute',ru:'Ударов в минуту',uz:'Daqiqadagi zarbalar soni'},
 d:{en:'The heart rate. A normal adult resting rate is 60–100.',ru:'Частота сердечных сокращений. Норма у взрослого в покое — 60–100.',uz:'Yurak urish chastotasi. Kattalarda tinch holatda norma — 60–100.'}},
{k:'pwave',c:'ecg',a:[],w:{en:['p wave*'],ru:['зубец p','зубца p','зубцы p','зубцов p','зубцом p'],uz:['p tishcha*']},
 n:{en:'P wave',ru:'Зубец P',uz:'P tishcha'},
 d:{en:'The small first bump: both atria being electrically activated (atrial depolarization).',ru:'Первый небольшой зубец: электрическое возбуждение обоих предсердий (деполяризация предсердий).',uz:'Birinchi kichik tishcha: ikkala boʻlmachaning elektr qoʻzgʻalishi (boʻlmachalar depolyarizatsiyasi).'},
 s:{en:'Upright before every QRS in sinus rhythm. Missing in AF, sawtooth in flutter. On the monitor: blue P = conducted, red P = blocked.',ru:'В синусовом ритме — положительный перед каждым QRS. Нет при ФП, «пила» при трепетании. На мониторе: синий P — проведён, красный — заблокирован.',uz:'Sinus ritmida har bir QRS oldidan musbat. Fibrillyatsiyada yoʻq, titrashda arrasimon. Monitorda: koʻk P — oʻtkazilgan, qizil P — toʻsilgan.'}},
{k:'qrs',c:'ecg',a:['QRS'],w:{en:[],ru:[],uz:[]},
 n:{en:'QRS complex',ru:'Комплекс QRS',uz:'QRS kompleksi'},
 d:{en:'The big spike: the ventricles being electrically activated. It is the trigger for the ventricles to contract.',ru:'Высокий пик: электрическое возбуждение желудочков. Это сигнал к их сокращению.',uz:'Baland choʻqqi: qorinchalarning elektr qoʻzgʻalishi. Bu qorinchalar qisqarishi uchun signal.'},
 s:{en:'Normal is narrow: under 120 ms (3 small squares). Wide means the impulse is taking a slow route: bundle branch block, PVC or VT.',ru:'В норме узкий: меньше 120 мс (3 малые клетки). Широкий — импульс идёт медленным путём: блокада ножки, ЖЭС или ЖТ.',uz:'Normada tor: 120 ms dan kam (3 kichik katak). Keng boʻlsa, impuls sekin yoʻldan ketmoqda: oyoqcha blokadasi, ekstrasistola yoki qorinchalar taxikardiyasi.'}},
{k:'twave',c:'ecg',a:[],w:{en:['t wave*'],ru:['зубец t','зубца t','зубцы t'],uz:['t tishcha*']},
 n:{en:'T wave',ru:'Зубец T',uz:'T tishcha'},
 d:{en:'The wave after the QRS: the ventricles electrically recovering (repolarization), getting ready for the next beat.',ru:'Волна после QRS: электрическое восстановление желудочков (реполяризация) перед следующим ударом.',uz:'QRS dan keyingi toʻlqin: qorinchalarning elektr tiklanishi (repolyarizatsiya), keyingi zarbaga tayyorgarlik.'},
 s:{en:'S2, the valves closing, lands near the end of the T wave.',ru:'S2 — закрытие клапанов — приходится примерно на конец зубца T.',uz:'S2 — klapanlar yopilishi — taxminan T tishcha oxiriga toʻgʻri keladi.'}},
{k:'pr',c:'ecg',a:['PR'],w:{en:[],ru:[],uz:[]},
 n:{en:'PR interval',ru:'Интервал PR',uz:'PR oraligʻi'},
 d:{en:'Time from the start of the P wave to the start of the QRS: how long the signal takes to cross the AV node.',ru:'Время от начала P до начала QRS: сколько импульс идёт через АВ-узел.',uz:'P boshidan QRS boshigacha boʻlgan vaqt: impuls AV tugundan qancha vaqtda oʻtishi.'},
 s:{en:'Normal 120–200 ms (3–5 small squares). Long = AV block. Short = accessory pathway (WPW).',ru:'Норма 120–200 мс (3–5 малых клеток). Длинный — АВ-блокада. Короткий — добавочный путь (WPW).',uz:'Norma 120–200 ms (3–5 kichik katak). Uzun — AV blokada. Qisqa — qoʻshimcha yoʻl (WPW).'}},
{k:'qt',c:'ecg',a:['QT'],w:{en:[],ru:[],uz:[]},
 n:{en:'QT interval',ru:'Интервал QT',uz:'QT oraligʻi'},
 d:{en:'From the start of the QRS to the end of the T wave: the whole electrical systole of the ventricles.',ru:'От начала QRS до конца зубца T: вся электрическая систола желудочков.',uz:'QRS boshidan T tishcha oxirigacha: qorinchalarning butun elektr sistolasi.'},
 s:{en:'It shortens as heart rate rises. Smart Heart scales it with Bazett\'s formula.',ru:'Укорачивается при учащении ритма. Smart Heart рассчитывает его по формуле Базетта.',uz:'Chastota oshganda qisqaradi. Smart Heart uni Bazett formulasi bilan hisoblaydi.'}},
{k:'rr',c:'ecg',a:['RR'],w:{en:[],ru:[],uz:[]},
 n:{en:'RR interval',ru:'Интервал RR',uz:'RR oraligʻi'},
 d:{en:'The time between two neighbouring QRS spikes: one full heartbeat.',ru:'Время между двумя соседними QRS: один полный сердечный цикл.',uz:'Ikki qoʻshni QRS orasidagi vaqt: bitta toʻliq yurak sikli.'},
 s:{en:'Equal RR = regular rhythm. Randomly different RR = think AF.',ru:'Одинаковые RR — ритм регулярный. Беспорядочно разные RR — думайте о ФП.',uz:'RR bir xil — ritm muntazam. RR tartibsiz har xil — fibrillyatsiyani oʻylang.'}},
{k:'delta',c:'ecg',a:[],w:{en:['delta wave'],ru:['дельта-волн*'],uz:['delta-toʻlqin']},
 n:{en:'Delta wave',ru:'Дельта-волна',uz:'Delta-toʻlqin'},
 d:{en:'A slurred, slow upstroke at the start of the QRS: part of the ventricle activated early through an accessory pathway (WPW).',ru:'Пологий медленный подъём в начале QRS: часть желудочка возбуждается раньше через добавочный путь (WPW).',uz:'QRS boshidagi qiya, sekin koʻtarilish: qorinchaning bir qismi qoʻshimcha yoʻl orqali erta qoʻzgʻaladi (WPW).'}},
{k:'rsr',c:'ecg',a:['rSR′'],w:{en:[],ru:[],uz:[]},
 n:{en:'rSR′ pattern ("M" shape)',ru:'Комплекс rSR′ (форма «М»)',uz:'rSR′ shakli («M» shaklida)'},
 d:{en:'An M-shaped QRS in lead V1: the late right-ventricle activation of right bundle branch block.',ru:'QRS в форме буквы «М» в отведении V1: позднее возбуждение правого желудочка при блокаде правой ножки.',uz:'V1 tarmoqda «M» shaklidagi QRS: oʻng oyoqcha blokadasida oʻng qorinchaning kech qoʻzgʻalishi.'}},
{k:'discord',c:'ecg',a:[],w:{en:['discordant'],ru:['дискордантн*'],uz:['diskordant']},
 n:{en:'Discordant T wave',ru:'Дискордантный зубец T',uz:'Diskordant T tishcha'},
 d:{en:'A T wave pointing the opposite way to the main QRS deflection. Expected whenever the QRS is wide.',ru:'Зубец T, направленный противоположно основному отклонению QRS. Ожидаем при любом широком QRS.',uz:'Asosiy QRS ogʻishiga teskari yoʻnalgan T tishcha. QRS keng boʻlganda kutiladi.'}},

/* ---------- Heart sounds ---------- */
{k:'s1',c:'sound',a:['S1'],w:{en:[],ru:[],uz:[]},
 n:{en:'First heart sound ("lub")',ru:'Первый тон сердца (I тон)',uz:'Birinchi yurak toni (I ton)'},
 d:{en:'The mitral and tricuspid valves snapping shut as the ventricles start to contract. It marks the start of systole.',ru:'Захлопывание митрального и трикуспидального клапанов в начале сокращения желудочков. Начало систолы.',uz:'Qorinchalar qisqara boshlaganda mitral va trikuspidal klapanlarning yopilishi. Sistola boshlanishi.'},
 s:{en:'About 40 ms after the QRS, loudest at the apex. Loud with a short PR or mitral stenosis; soft with a long PR.',ru:'Примерно через 40 мс после QRS, громче всего на верхушке. Громкий при коротком PR или митральном стенозе; тихий при длинном PR.',uz:'QRS dan taxminan 40 ms keyin, choʻqqida eng baland. Qisqa PR yoki mitral stenozda baland; uzun PR da sust.'}},
{k:'s2',c:'sound',a:['S2'],w:{en:[],ru:[],uz:[]},
 n:{en:'Second heart sound ("dub")',ru:'Второй тон сердца (II тон)',uz:'Ikkinchi yurak toni (II ton)'},
 d:{en:'The aortic (A2) and pulmonary (P2) valves closing at the end of systole.',ru:'Закрытие аортального (A2) и лёгочного (P2) клапанов в конце систолы.',uz:'Sistola oxirida aortal (A2) va oʻpka arteriyasi (P2) klapanlarining yopilishi.'},
 s:{en:'Near the end of the T wave, loudest at the base. Listen for its split at the pulmonic area.',ru:'У конца зубца T, громче на основании сердца. Слушайте его расщепление в точке лёгочной артерии.',uz:'T tishcha oxiri yaqinida, yurak asosida baland. Ajralishini oʻpka arteriyasi nuqtasida tinglang.'}},
{k:'s3',c:'sound',a:['S3'],w:{en:[],ru:[],uz:[]},
 n:{en:'Third heart sound',ru:'Третий тон сердца (III тон)',uz:'Uchinchi yurak toni (III ton)'},
 d:{en:'A dull thud in early diastole as blood rushes into an overfilled or failing ventricle. Normal in children and athletes.',ru:'Глухой тон в начале диастолы, когда кровь устремляется в переполненный или слабый желудочек. Норма у детей и спортсменов.',uz:'Erta diastolada qon toʻlib ketgan yoki zaif qorinchaga otilganda paydo boʻladigan boʻgʻiq ton. Bolalar va sportchilarda normal.'},
 s:{en:'About 140 ms after S2 and low-pitched: bell at the apex. Rhythm: "Ken-TUC-ky".',ru:'Примерно через 140 мс после S2, низкий: воронкой на верхушке.',uz:'S2 dan taxminan 140 ms keyin, past: choʻqqida qoʻngʻiroqcha bilan.'}},
{k:'s4',c:'sound',a:['S4'],w:{en:[],ru:[],uz:[]},
 n:{en:'Fourth heart sound',ru:'Четвёртый тон сердца (IV тон)',uz:'Toʻrtinchi yurak toni (IV ton)'},
 d:{en:'A low sound just before S1: the atrium kicking blood into a stiff ventricle. It needs a real atrial contraction, so it never occurs in AF.',ru:'Низкий тон прямо перед S1: предсердие «вталкивает» кровь в жёсткий желудочек. Нужно настоящее сокращение предсердий, поэтому при ФП его не бывает.',uz:'S1 dan sal oldin past ton: boʻlmacha qonni qattiq qorinchaga itaradi. Haqiqiy boʻlmacha qisqarishi kerak, shuning uchun fibrillyatsiyada boʻlmaydi.'},
 s:{en:'Tied to each P wave; bell at the apex. Rhythm: "TEN-nes-see".',ru:'Привязан к каждому зубцу P; воронкой на верхушке.',uz:'Har bir P tishchaga bogʻliq; choʻqqida qoʻngʻiroqcha bilan.'}},
{k:'a2',c:'sound',a:['A2'],w:{en:[],ru:[],uz:[]},
 n:{en:'A2: aortic part of S2',ru:'A2: аортальный компонент II тона',uz:'A2: II tonning aortal komponenti'},
 d:{en:'The sound of the aortic valve closing. Normally it is the first and louder half of S2.',ru:'Звук закрытия аортального клапана. В норме — первая и более громкая половина S2.',uz:'Aortal klapan yopilish tovushi. Normada S2 ning birinchi va balandroq yarmi.'},
 s:{en:'Soft or absent in severe aortic stenosis (the valve barely moves).',ru:'Ослаблен или отсутствует при тяжёлом аортальном стенозе (клапан почти не движется).',uz:'Ogʻir aortal stenozda sust yoki yoʻq (klapan deyarli qimirlamaydi).'}},
{k:'p2',c:'sound',a:['P2'],w:{en:[],ru:[],uz:[]},
 n:{en:'P2: pulmonary part of S2',ru:'P2: лёгочный компонент II тона',uz:'P2: II tonning pulmonal komponenti'},
 d:{en:'The sound of the pulmonary valve closing, normally just after A2.',ru:'Звук закрытия клапана лёгочной артерии, в норме сразу после A2.',uz:'Oʻpka arteriyasi klapanining yopilish tovushi, normada A2 dan keyin.'},
 s:{en:'A loud P2 suggests pulmonary hypertension.',ru:'Громкий P2 (акцент II тона на лёгочной артерии) говорит о лёгочной гипертензии.',uz:'Baland P2 oʻpka gipertenziyasidan dalolat beradi.'}},
{k:'split',c:'sound',a:[],w:{en:['physiological split*','splitting','split'],ru:['физиологическ* расщеплени*','расщеплени*'],uz:['fiziologik ajralish*','ajralish*']},
 n:{en:'Splitting of S2',ru:'Расщепление II тона',uz:'II ton ajralishi'},
 d:{en:'Hearing S2 as two sounds, A2 then P2. Breathing in delays P2, so a normal split widens on inspiration and closes on expiration.',ru:'II тон слышен как два звука: A2, затем P2. Вдох задерживает P2, поэтому нормальное расщепление на вдохе расширяется, а на выдохе исчезает.',uz:'II ton ikki tovush boʻlib eshitiladi: avval A2, soʻng P2. Nafas olish P2 ni kechiktiradi, shuning uchun normal ajralish nafas olishda kengayadi, nafas chiqarishda yopiladi.'},
 s:{en:'Wide and still moving: RBBB. Reversed: LBBB or severe AS. Fixed, not moving at all: ASD.',ru:'Широкое и «дышащее» — БПНПГ. Обратное — БЛНПГ или тяжёлый аортальный стеноз. Фиксированное — ДМПП.',uz:'Keng va harakatchan — oʻng oyoqcha blokadasi. Teskari — chap oyoqcha blokadasi yoki ogʻir aortal stenoz. Qotib qolgan — boʻlmachalararo toʻsiq nuqsoni.'}},
{k:'paradox',c:'sound',a:[],w:{en:['paradoxical split*','paradoxical (reversed) split*'],ru:['парадоксальн* расщеплени*','парадоксальн* (обратн*) расщеплени*'],uz:['paradoksal ajralish*','paradoksal (teskari) ajralish*']},
 n:{en:'Paradoxical (reversed) splitting',ru:'Парадоксальное расщепление',uz:'Paradoksal ajralish'},
 d:{en:'A2 comes after P2 because the left ventricle is late (LBBB, severe aortic stenosis). The split narrows on inspiration: the opposite of normal.',ru:'A2 идёт после P2, потому что левый желудочек запаздывает (БЛНПГ, тяжёлый аортальный стеноз). На вдохе расщепление сужается — наоборот по сравнению с нормой.',uz:'Chap qorincha kechikkani uchun A2 P2 dan keyin keladi (chap oyoqcha blokadasi, ogʻir aortal stenoz). Nafas olishda ajralish torayadi — normaga teskari.'}},
{k:'os',c:'sound',a:['OS'],w:{en:['opening snap'],ru:['щелч* открытия'],uz:['ochilish ton*']},
 n:{en:'Opening snap',ru:'Щелчок открытия митрального клапана',uz:'Mitral klapan ochilish toni'},
 d:{en:'A sharp click in early diastole when a stiff, narrowed mitral valve is forced open.',ru:'Резкий щелчок в начале диастолы, когда жёсткий суженный митральный клапан распахивается.',uz:'Erta diastolada qattiq, torayib qolgan mitral klapan majburan ochilganda chiqadigan keskin shiqillash.'},
 s:{en:'Shortly after S2. The closer it is to A2, the tighter the stenosis.',ru:'Вскоре после S2. Чем ближе к A2, тем тяжелее стеноз.',uz:'S2 dan keyin tez orada. A2 ga qanchalik yaqin boʻlsa, stenoz shunchalik ogʻir.'}},
{k:'ec',c:'sound',a:['EC'],w:{en:['ejection click'],ru:['щелч* изгнания'],uz:['haydash klik*']},
 n:{en:'Ejection click',ru:'Щелчок изгнания',uz:'Haydash kliki'},
 d:{en:'A high-pitched click just after S1 as a domed but still mobile aortic valve snaps open.',ru:'Высокий щелчок сразу после S1, когда куполообразный, но ещё подвижный аортальный клапан резко открывается.',uz:'S1 dan keyin darhol, gumbazsimon, lekin hali harakatchan aortal klapan keskin ochilganda chiqadigan baland klik.'}},
{k:'click',c:'sound',a:[],w:{en:['mid-systolic click'],ru:['мезосистолическ* щелч*'],uz:['mezosistolik klik*']},
 n:{en:'Mid-systolic click',ru:'Мезосистолический щелчок',uz:'Mezosistolik klik'},
 d:{en:'The floppy mitral leaflet snapping tight in mid-systole, like a sail suddenly filling with wind (mitral valve prolapse).',ru:'Провисающая митральная створка резко натягивается в середине систолы, как парус, внезапно наполненный ветром (пролапс митрального клапана).',uz:'Boʻshashgan mitral tavaqa sistola oʻrtasida keskin taranglashadi, xuddi shamol toʻsatdan toʻldirgan yelkan kabi (mitral klapan prolapsi).'}},
{k:'murmur',c:'sound',a:[],w:{en:['murmur*'],ru:['шум','шума','шумы','шумом','шумов','шуму'],uz:['shovqin*']},
 n:{en:'Heart murmur',ru:'Шум сердца',uz:'Yurak shovqini'},
 d:{en:'A whooshing sound from turbulent blood flow: through a narrowed valve (stenosis) or backwards through a leaky one (regurgitation).',ru:'Шелестящий звук турбулентного кровотока: через суженный клапан (стеноз) или обратно через негерметичный (регургитация).',uz:'Turbulent qon oqimining shuvillagan tovushi: torayib qolgan klapan orqali (stenoz) yoki zich yopilmaydigan klapan orqali teskari (regurgitatsiya).'},
 s:{en:'Ask three questions: systolic or diastolic? Where is it loudest? Where does it spread? Loudness is graded 1–6.',ru:'Задайте три вопроса: систолический или диастолический? Где громче всего? Куда проводится? Громкость оценивают по шкале 1–6.',uz:'Uch savol bering: sistolikmi yoki diastolikmi? Qayerda eng baland? Qayerga tarqaladi? Balandligi 1–6 shkala boʻyicha baholanadi.'}},
{k:'gallop',c:'sound',a:[],w:{en:['summation gallop','gallop'],ru:['суммационн* галоп*','галоп*'],uz:['summatsion galop*','galop*']},
 n:{en:'Gallop rhythm',ru:'Ритм галопа',uz:'Galop ritmi'},
 d:{en:'Three sounds per beat (S1, S2 plus S3 and/or S4) like a galloping horse: a classic sign of heart failure.',ru:'Три звука на удар (S1, S2 и S3 и/или S4), как стук копыт скачущей лошади: классический признак сердечной недостаточности.',uz:'Har zarbada uchta tovush (S1, S2 va S3 va/yoki S4), xuddi chopayotgan ot dupuri: yurak yetishmovchiligining klassik belgisi.'},
 s:{en:'At fast rates S3 and S4 can fuse into one "summation gallop".',ru:'При высокой частоте S3 и S4 могут слиться в один «суммационный галоп».',uz:'Tez ritmda S3 va S4 bitta «summatsion galop»ga qoʻshilib ketishi mumkin.'}},
{k:'cannon',c:'sound',a:[],w:{en:['bruit de canon','cannon'],ru:['пушечн*'],uz:['«toʻp»']},
 n:{en:'Cannon S1 (bruit de canon)',ru:'«Пушечный» тон Стражеско',uz:'Strajesko «toʻp» toni'},
 d:{en:'A very loud S1 when the atria happen to contract just before the ventricles, leaving the AV valves wide open. A sign of AV dissociation.',ru:'Очень громкий S1, когда предсердия случайно сокращаются прямо перед желудочками и АВ-клапаны остаются широко открытыми. Признак АВ-диссоциации.',uz:'Boʻlmachalar tasodifan qorinchalardan sal oldin qisqarib, AV klapanlar keng ochiq qolganda juda baland S1. AV dissotsiatsiya belgisi.'}},
{k:'embryo',c:'sound',a:[],w:{en:['embryocardia'],ru:['эмбриокарди*'],uz:['embriokardiya*']},
 n:{en:'Embryocardia (tic-tac rhythm)',ru:'Эмбриокардия (маятникообразный ритм)',uz:'Embriokardiya (mayatniksimon ritm)'},
 d:{en:'S1 and S2 evenly spaced like a fetal heartbeat, because diastole has shrunk to the length of systole.',ru:'S1 и S2 следуют через равные промежутки, как у плода, потому что диастола укоротилась до длины систолы.',uz:'S1 va S2 homila yuragidagidek teng oraliqda, chunki diastola sistola uzunligigacha qisqargan.'}},
{k:'presys',c:'sound',a:[],w:{en:['presystolic accentuation','presystolic crescendo'],ru:['пресистолическ* усилени*'],uz:['presistolik kuchayish*']},
 n:{en:'Presystolic accentuation',ru:'Пресистолическое усиление',uz:'Presistolik kuchayish'},
 d:{en:'The rumble of mitral stenosis getting louder just before S1, because the atria contract and push extra blood through the narrow valve. It disappears in AF.',ru:'Рокот митрального стеноза усиливается прямо перед S1: предсердия сокращаются и проталкивают кровь через узкий клапан. При ФП исчезает.',uz:'Mitral stenoz gʻurillashi S1 dan sal oldin kuchayadi: boʻlmachalar qisqarib, qonni tor klapan orqali itaradi. Fibrillyatsiyada yoʻqoladi.'}},
{k:'rumble',c:'sound',a:[],w:{en:['rumble'],ru:['рокот*'],uz:['gʻurillash*']},
 n:{en:'Diastolic rumble',ru:'Диастолический рокот',uz:'Diastolik gʻurillash'},
 d:{en:'A low-pitched, rolling diastolic murmur, like distant thunder: blood squeezing through a narrow mitral valve.',ru:'Низкий раскатистый диастолический шум, как далёкий гром: кровь протискивается через узкий митральный клапан.',uz:'Uzoqdagi momaqaldiroqqa oʻxshash past, dumalovchi diastolik shovqin: qon tor mitral klapandan siqilib oʻtadi.'},
 s:{en:'Easy to miss: bell, apex, patient turned onto the left side.',ru:'Легко пропустить: воронка, верхушка, пациент на левом боку.',uz:'Oʻtkazib yuborish oson: qoʻngʻiroqcha, choʻqqi, bemor chap yonboshida.'}},

/* ---------- Valves & murmurs ---------- */
{k:'as',c:'valve',a:['AS'],w:{en:['aortic stenosis'],ru:['аортальн* стеноз*'],uz:['aortal stenoz*']},
 n:{en:'Aortic stenosis',ru:'Аортальный стеноз',uz:'Aortal stenoz'},
 d:{en:'The aortic valve is narrowed, usually calcified with age, so the left ventricle must squeeze hard to push blood out.',ru:'Аортальный клапан сужен, чаще всего из-за возрастного кальциноза, и левому желудочку приходится сильно сжиматься, чтобы вытолкнуть кровь.',uz:'Aortal klapan torayib qolgan, koʻpincha yosh bilan kalsinoz tufayli, chap qorincha qonni chiqarish uchun kuchli qisqarishi kerak.'},
 s:{en:'Harsh diamond-shaped systolic murmur at the aortic area, spreading to the neck. Later peak and softer A2 = more severe.',ru:'Грубый ромбовидный систолический шум в аортальной точке с проведением на шею. Чем позже пик и тише A2, тем тяжелее стеноз.',uz:'Aorta nuqtasida dagʻal, rombsimon sistolik shovqin, boʻyinga tarqaladi. Choʻqqi qanchalik kech va A2 qanchalik sust boʻlsa, shunchalik ogʻir.'}},
{k:'ms',c:'valve',a:['MS'],w:{en:['mitral stenosis'],ru:['митральн* стеноз*'],uz:['mitral stenoz*']},
 n:{en:'Mitral stenosis',ru:'Митральный стеноз',uz:'Mitral stenoz'},
 d:{en:'The mitral valve is narrowed, almost always after rheumatic fever, so blood struggles to fill the left ventricle.',ru:'Митральный клапан сужен, почти всегда после ревматической лихорадки, и крови трудно наполнить левый желудочек.',uz:'Mitral klapan torayib qolgan, deyarli har doim revmatik isitmadan keyin, shuning uchun qon chap qorinchani qiyinchilik bilan toʻldiradi.'},
 s:{en:'Loud S1, an opening snap, then a low diastolic rumble at the apex: bell, patient on the left side.',ru:'Громкий S1, щелчок открытия, затем низкий диастолический рокот на верхушке: воронка, пациент на левом боку.',uz:'Baland S1, ochilish toni, soʻng choʻqqida past diastolik gʻurillash: qoʻngʻiroqcha, bemor chap yonboshida.'}},
{k:'mr',c:'valve',a:['MR'],w:{en:['mitral regurgitation'],ru:['митральн* регургитаци*','митральн* недостаточност*'],uz:['mitral regurgitatsiya*']},
 n:{en:'Mitral regurgitation',ru:'Митральная регургитация (недостаточность)',uz:'Mitral regurgitatsiya (yetishmovchilik)'},
 d:{en:'The mitral valve leaks: with every contraction some blood shoots backwards into the left atrium.',ru:'Митральный клапан негерметичен: при каждом сокращении часть крови выбрасывается обратно в левое предсердие.',uz:'Mitral klapan zich yopilmaydi: har qisqarishda qonning bir qismi chap boʻlmachaga teskari otiladi.'},
 s:{en:'Blowing murmur through the whole of systole at the apex, spreading to the armpit.',ru:'Дующий шум на протяжении всей систолы на верхушке, проводится в подмышечную область.',uz:'Choʻqqida butun sistola davomida puflovchi shovqin, qoʻltiq ostiga tarqaladi.'}},
{k:'ar',c:'valve',a:['AR'],w:{en:['aortic regurgitation'],ru:['аортальн* регургитаци*','аортальн* недостаточност*'],uz:['aortal regurgitatsiya*']},
 n:{en:'Aortic regurgitation',ru:'Аортальная регургитация (недостаточность)',uz:'Aortal regurgitatsiya (yetishmovchilik)'},
 d:{en:'The aortic valve leaks: in diastole blood falls back from the aorta into the left ventricle.',ru:'Аортальный клапан негерметичен: в диастолу кровь возвращается из аорты в левый желудочек.',uz:'Aortal klapan zich yopilmaydi: diastolada qon aortadan chap qorinchaga qaytib tushadi.'},
 s:{en:'High-pitched fading murmur starting right at S2, left sternal border, patient leaning forward.',ru:'Высокий убывающий шум, начинающийся сразу с S2, у левого края грудины, пациент наклонён вперёд.',uz:'S2 bilan darhol boshlanadigan baland, pasayuvchi shovqin, toʻsh suyagining chap chetida, bemor oldinga engashgan.'}},
{k:'mvp',c:'valve',a:['MVP'],w:{en:['mitral valve prolapse'],ru:['пролапс* митральн*'],uz:['mitral klapan prolaps*']},
 n:{en:'Mitral valve prolapse',ru:'Пролапс митрального клапана',uz:'Mitral klapan prolapsi'},
 d:{en:'A floppy mitral leaflet bulges back into the left atrium during systole.',ru:'Провисающая митральная створка выбухает в левое предсердие во время систолы.',uz:'Boʻshashgan mitral tavaqa sistola paytida chap boʻlmachaga boʻrtib chiqadi.'},
 s:{en:'Mid-systolic click, then a late systolic murmur. Standing up moves both earlier.',ru:'Мезосистолический щелчок, затем поздний систолический шум. При вставании оба смещаются раньше.',uz:'Mezosistolik klik, soʻng kech sistolik shovqin. Tik turganda ikkalasi oldinroqqa suriladi.'}},
{k:'sclerosis',c:'valve',a:[],w:{en:['aortic sclerosis'],ru:['аортальн* склероз*'],uz:['aortal skleroz*']},
 n:{en:'Aortic sclerosis',ru:'Склероз аортального клапана',uz:'Aortal klapan sklerozi'},
 d:{en:'A thickened, stiff aortic valve that still opens well. It makes a murmur but does not block the flow.',ru:'Утолщённый жёсткий аортальный клапан, который всё ещё хорошо открывается. Даёт шум, но не мешает кровотоку.',uz:'Qalinlashgan, qattiq, lekin hali yaxshi ochiladigan aortal klapan. Shovqin beradi, ammo oqimga toʻsqinlik qilmaydi.'}},
{k:'holo',c:'valve',a:[],w:{en:['holosystolic'],ru:['пансистолическ*'],uz:['golosistolik']},
 n:{en:'Holosystolic (pansystolic)',ru:'Пансистолический',uz:'Golosistolik'},
 d:{en:'Lasting through the whole of systole, from S1 right into S2. Typical of mitral regurgitation.',ru:'Длящийся всю систолу, от S1 до S2. Типичен для митральной регургитации.',uz:'Butun sistola davomida, S1 dan S2 gacha davom etadi. Mitral regurgitatsiya uchun xos.'}},
{k:'cresc',c:'valve',a:[],w:{en:['crescendo–decrescendo'],ru:['нарастающе-убывающ*'],uz:['kuchayib-pasayuvchi']},
 n:{en:'Crescendo–decrescendo',ru:'Нарастающе-убывающий (ромбовидный)',uz:'Kuchayib-pasayuvchi (rombsimon)'},
 d:{en:'Diamond-shaped: the murmur gets louder, peaks, then fades. Typical of aortic stenosis.',ru:'Ромбовидный: шум нарастает, достигает пика и затихает. Типичен для аортального стеноза.',uz:'Rombsimon: shovqin kuchayadi, choʻqqiga chiqadi, soʻng soʻnadi. Aortal stenoz uchun xos.'}},
{k:'area',c:'valve',a:['cm²','см²','sm²'],w:{en:['valve area'],ru:['площадь'],uz:['maydon*']},
 n:{en:'Valve area',ru:'Площадь клапана',uz:'Klapan maydoni'},
 d:{en:'How wide the valve opens. Normal aortic about 3–4 cm², normal mitral about 4–6 cm².',ru:'Насколько широко открывается клапан. Норма: аортальный около 3–4 см², митральный около 4–6 см².',uz:'Klapan qanchalik keng ochilishi. Norma: aortal taxminan 3–4 sm², mitral taxminan 4–6 sm².'},
 s:{en:'Aortic below 1.0 cm² is severe stenosis. Mitral at or below 1.0–1.5 cm² is severe.',ru:'Аортальный меньше 1,0 см² — тяжёлый стеноз. Митральный 1,0–1,5 см² и меньше — тяжёлый.',uz:'Aortal 1,0 sm² dan kam — ogʻir stenoz. Mitral 1,0–1,5 sm² va undan kam — ogʻir.'}},
{k:'bell',c:'anat',a:[],w:{en:['bell'],ru:['воронк*'],uz:['qoʻngʻiroqcha*']},
 n:{en:'Bell of the stethoscope',ru:'Воронка стетоскопа',uz:'Stetoskop qoʻngʻiroqchasi'},
 d:{en:'The cup-shaped side. Rest it lightly on the skin to hear LOW sounds: S3, S4 and the rumble of mitral stenosis.',ru:'Чашеобразная сторона. Прикладывайте легко, чтобы слышать НИЗКИЕ звуки: S3, S4 и рокот митрального стеноза.',uz:'Kosachasimon tomoni. PAST tovushlarni (S3, S4, mitral stenoz gʻurillashi) eshitish uchun teriga yengil qoʻying.'}},
{k:'diaphragm',c:'anat',a:[],w:{en:['diaphragm'],ru:['мембран*'],uz:['membrana*']},
 n:{en:'Diaphragm of the stethoscope',ru:'Мембрана стетоскопа',uz:'Stetoskop membranasi'},
 d:{en:'The flat side. Press it firmly to hear HIGH sounds: S1, S2, clicks and regurgitant murmurs.',ru:'Плоская сторона. Прижимайте плотно, чтобы слышать ВЫСОКИЕ звуки: S1, S2, щелчки и шумы регургитации.',uz:'Yassi tomoni. BALAND tovushlarni (S1, S2, kliklar, regurgitatsiya shovqinlari) eshitish uchun mahkam bosing.'}},

/* ---------- Anatomy ---------- */
{k:'ra',c:'anat',a:['RA','ПП','OʻB'],w:{en:['right atrium'],ru:['прав* предсерди*'],uz:['oʻng boʻlmacha*']},
 n:{en:'Right atrium',ru:'Правое предсердие',uz:'Oʻng boʻlmacha'},
 d:{en:'Collects blood returning from the body and passes it to the right ventricle. The sinus node lives here.',ru:'Собирает кровь, возвращающуюся от тела, и передаёт её в правый желудочек. Здесь находится синусовый узел.',uz:'Tanadan qaytgan qonni yigʻib, oʻng qorinchaga uzatadi. Sinus tuguni shu yerda joylashgan.'}},
{k:'la',c:'anat',a:['LA','ЛП','ChB'],w:{en:['left atrium'],ru:['лев* предсерди*'],uz:['chap boʻlmacha*']},
 n:{en:'Left atrium',ru:'Левое предсердие',uz:'Chap boʻlmacha'},
 d:{en:'Collects oxygen-rich blood from the lungs and passes it through the mitral valve.',ru:'Собирает богатую кислородом кровь из лёгких и передаёт её через митральный клапан.',uz:'Oʻpkadan kislorodga boy qonni yigʻib, mitral klapan orqali uzatadi.'}},
{k:'rv',c:'anat',a:['RV','ПЖ','OʻQ'],w:{en:['right ventricle'],ru:['прав* желудоч*'],uz:['oʻng qorincha*']},
 n:{en:'Right ventricle',ru:'Правый желудочек',uz:'Oʻng qorincha'},
 d:{en:'Pumps blood to the lungs through the pulmonary valve.',ru:'Перекачивает кровь в лёгкие через клапан лёгочной артерии.',uz:'Qonni oʻpka arteriyasi klapani orqali oʻpkaga haydaydi.'}},
{k:'lv',c:'anat',a:['LV','ЛЖ','ChQ'],w:{en:['left ventricle'],ru:['лев* желудоч*'],uz:['chap qorincha*']},
 n:{en:'Left ventricle',ru:'Левый желудочек',uz:'Chap qorincha'},
 d:{en:'The main pump: pushes blood through the aortic valve to the whole body. The thickest-walled chamber.',ru:'Главный насос: выталкивает кровь через аортальный клапан ко всему телу. Самая толстостенная камера.',uz:'Asosiy nasos: qonni aortal klapan orqali butun tanaga haydaydi. Devori eng qalin boʻlim.'}},
{k:'sa',c:'anat',a:['SA'],w:{en:['sinus node','sinoatrial node'],ru:['синусов* узл*','синусов* узел'],uz:['sinus tugun*']},
 n:{en:'Sinoatrial (sinus) node',ru:'Синоатриальный (синусовый) узел',uz:'Sinoatrial (sinus) tugun'},
 d:{en:"The heart's natural pacemaker, in the wall of the right atrium. Every normal beat starts here.",ru:'Естественный водитель ритма сердца в стенке правого предсердия. Здесь начинается каждый нормальный удар.',uz:'Yurakning tabiiy ritm boshqaruvchisi, oʻng boʻlmacha devorida. Har bir normal zarba shu yerdan boshlanadi.'}},
{k:'avn',c:'anat',a:[],w:{en:['av node'],ru:['ав-узл*','ав-узел'],uz:['av tugun*']},
 n:{en:'Atrioventricular (AV) node',ru:'Атриовентрикулярный (АВ) узел',uz:'Atrioventrikulyar (AV) tugun'},
 d:{en:'The gatekeeper between atria and ventricles. It holds the signal about 0.1 s so the atria can finish emptying first.',ru:'«Привратник» между предсердиями и желудочками. Задерживает импульс примерно на 0,1 с, чтобы предсердия успели опорожниться.',uz:'Boʻlmacha va qorinchalar orasidagi «darvozabon». Boʻlmachalar boʻshab ulgurishi uchun impulsni taxminan 0,1 s ushlab turadi.'}},
{k:'his',c:'anat',a:[],w:{en:['bundle of his','bundle branch*'],ru:['пучк* гиса','ножк* пучка гиса'],uz:['gis tutami']},
 n:{en:'Bundle of His and bundle branches',ru:'Пучок Гиса и его ножки',uz:'Gis tutami va uning oyoqchalari'},
 d:{en:'The wiring that carries the signal down the wall between the ventricles, then splits into a right and a left branch.',ru:'«Проводка», несущая импульс вниз по перегородке между желудочками и делящаяся на правую и левую ножки.',uz:'Impulsni qorinchalararo toʻsiq boʻylab pastga olib boradigan, soʻng oʻng va chap oyoqchalarga boʻlinadigan «sim».'}},
{k:'av',c:'anat',a:['AV','АВ'],w:{en:[],ru:[],uz:[]},
 n:{en:'Atrioventricular (AV)',ru:'Атриовентрикулярный (АВ)',uz:'Atrioventrikulyar (AV)'},
 d:{en:'"Between the atria and the ventricles": AV node, AV block, AV valves (mitral and tricuspid).',ru:'«Между предсердиями и желудочками»: АВ-узел, АВ-блокада, АВ-клапаны (митральный и трикуспидальный).',uz:'«Boʻlmacha va qorinchalar orasida»: AV tugun, AV blokada, AV klapanlar (mitral va trikuspidal).'}},
{k:'apex',c:'anat',a:[],w:{en:['apex'],ru:['верхушк*','верхушечн*'],uz:['yurak choʻqqisi','choʻqqi turtkisi']},
 n:{en:'Apex of the heart',ru:'Верхушка сердца',uz:'Yurak choʻqqisi'},
 d:{en:'The tip of the heart, felt at the 5th intercostal space in the mid-clavicular line. The best spot for mitral sounds.',ru:'Кончик сердца, пальпируется в 5-м межреберье по среднеключичной линии. Лучшее место для митральных звуков.',uz:'Yurak uchi, oʻrta oʻmrov chizigʻi boʻyicha 5-qovurgʻalararo oraliqda paypaslanadi. Mitral tovushlar uchun eng yaxshi joy.'}},
{k:'erb',c:'anat',a:['LLSB'],w:{en:["erb's point",'left lower sternal border','left sternal border'],ru:['боткина–эрба','боткин–эрб','левого края грудины','левый нижний край грудины'],uz:['botkin–erb*']},
 n:{en:"Erb's point",ru:'Точка Боткина–Эрба',uz:'Botkin–Erb nuqtasi'},
 d:{en:'The 3rd intercostal space at the left edge of the breastbone. The best place for aortic regurgitation. It is not the tricuspid area, which sits lower, at the 4th space (left lower sternal border).',ru:'3-е межреберье у левого края грудины. Лучшее место для аортальной регургитации. Это не трикуспидальная точка, которая расположена ниже.',uz:'Toʻsh suyagining chap chetida 3-qovurgʻalararo oraliq. Aortal regurgitatsiya uchun eng yaxshi joy. Bu trikuspidal nuqta emas — u pastroqda joylashgan.'}},

/* ---------- Clinical terms ---------- */

 n:{en:'Systole',ru:'Систола',uz:'Sistola'},

const S=Object.assign({rhythm:'nsr',rate:72,site:'mitral',piece:'diaphragm',out:'headphones',breath:true,vol:.8,link:true,mode:'explore',caseId:null,sealed:false},NORMAL_VALVES);

/* ---------------- Audio ---------------- */
let AC=null,chestA=null,chestB=null,master=null,BANDS={},bandFm=0;
const fm=()=>S.out==='speaker'?4:1;
function startAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
  chestA=AC.createBiquadFilter();chestB=AC.createBiquadFilter();master=AC.createGain();
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=5;comp.attack.value=.002;comp.release.value=.15;
  chestA.connect(chestB);chestB.connect(master);master.connect(comp);comp.connect(AC.destination);
  makeBands();applyChest();applyVol();
}
function applyChest(){
  if(!AC)return;const f=fm(),t=AC.currentTime;
  if(S.piece==='bell'){chestA.type='lowpass';chestA.frequency.setTargetAtTime(Math.min(230*f,16000),t,.03);chestA.Q.value=.6;chestB.type='lowshelf';chestB.frequency.value=90*f;chestB.gain.value=5;}
  else{chestA.type='highpass';chestA.frequency.setTargetAtTime(80*f,t,.03);chestA.Q.value=.55;chestB.type='highshelf';chestB.frequency.value=300*f;chestB.gain.value=4;}
}
function applyVol(){if(master)master.gain.setTargetAtTime(S.vol*S.vol*1.6,AC.currentTime,.03)}
const BDEF={low:[[68,1.0]],harsh:[[170,.8],[360,1.1]],blow:[[330,1.7]],hiss:[[480,2.0]]};
function bp(x,sr,fc,Q){const w=2*Math.PI*fc/sr,al=Math.sin(w)/(2*Q),c=Math.cos(w),a0=1+al,b0=al/a0,b2=-al/a0,a1=-2*c/a0,a2=(1-al)/a0;const y=new Float32Array(x.length);let x1=0,x2=0,y1=0,y2=0;for(let i=0;i<x.length;i++){const v=b0*x[i]+b2*x2-a1*y1-a2*y2;x2=x1;x1=x[i];y2=y1;y1=v;y[i]=v}return y}
function makeBands(){
  const sr=AC.sampleRate,n=Math.floor(sr*3),f=fm();bandFm=f;
  for(const k in BDEF){const out=new Float32Array(n);
    for(const [fc0,Q] of BDEF[k]){const fc=Math.min(fc0*f,sr*.45);const w=new Float32Array(n);for(let i=0;i<n;i++)w[i]=Math.random()*2-1;const y=bp(bp(w,sr,fc,Q),sr,fc,Q);for(let i=0;i<n;i++)out[i]+=y[i]}
    let rms=0;for(let i=0;i<n;i++)rms+=out[i]*out[i];rms=Math.sqrt(rms/n)||1;for(let i=0;i<n;i++)out[i]*=.35/rms;BANDS[k]=out}
}
const MS1=[[1,1],[1.9,.55],[3.1,.28],[4.9,.12]],MS2=[[1,1],[2.05,.6],[3.5,.3],[5.4,.14]],MLOW=[[1,1],[1.85,.35],[2.9,.12]];
function tone(b,sr,t,amp,f,dec,modes){
  if(amp<=.003)return;const n0=Math.round(t*sr);if(n0>=b.length)return;
  const len=Math.min(b.length-n0,Math.ceil(dec*6*sr));let ws=0;for(const m of modes)ws+=m[1];
  const ph=modes.map(()=>Math.random()*.6);
  for(let i=0;i<len;i++){const tt=i/sr,idx=n0+i;if(idx<0)continue;
    const env=(1-Math.exp(-tt/.0018))*Math.exp(-tt/dec),g=1-.16*Math.min(1,tt/(dec*4));
    let s=0;for(let m=0;m<modes.length;m++)s+=modes[m][1]*Math.sin(2*Math.PI*f*modes[m][0]*g*tt+ph[m]);
    b[idx]+=amp*env*s/ws}
}
function murmur(b,sr,t0,t1,band,amp,shape,trem){
  const n0=Math.max(0,Math.floor(t0*sr)),n1=Math.min(b.length,Math.floor(t1*sr)),L=n1-n0;if(L<=8||amp<=.002)return;
  const src=BANDS[band],off=Math.floor(Math.random()*(src.length-1)),rp=.007*sr;
  for(let i=0;i<L;i++){const x=i/L,ramp=Math.min(1,i/rp,(L-i)/rp);let m=amp*shape(x)*ramp;if(trem)m*=1+.35*Math.sin(2*Math.PI*trem*i/sr);b[n0+i]+=m*src[(off+i)%src.length]}
}

/* ---------------- Beat generator (one clock for ECG + sound) ---------------- */
const G={atr:[],ven:[],snd:[],src:[],tA:0,tV:0,k:0,base:''};
const BREATH=5;
const insp=t=>S.breath?.5-.5*Math.cos(2*Math.PI*t/BREATH):.3;
const inspiring=t=>S.breath&&Math.sin(2*Math.PI*t/BREATH)>0;
function pushV(t,kind,extra){const p=G.ven[G.ven.length-1];const rr=p?t-p.t:60/(S.rate||70);const v=Object.assign({t,kind,rr,built:false},extra||{});v.qt=.40*Math.sqrt(clamp(rr,.3,1.6))+((kind==='pvc'||kind==='vt'||kind==='lbbb'||(extra&&extra.wide))?.04:0);G.ven.push(v);return v}
function pushA(t,cond){G.atr.push({t,cond})}
function baseFor(r){return r==='af'?'af':r==='flutter'?'flutter':r==='vf'?'vf':''}
function gen(until){
  const r=S.rhythm,rate=S.rate;
  if(r==='vf'||r==='asys'){G.tA=Math.max(G.tA,until);G.tV=Math.max(G.tV,until);return}
  if(r==='chb'||r==='vt'){
    while(G.tA<until){G.tA+=60/78*(1+jit(.02));pushA(G.tA,false)}
    while(G.tV<until){G.tV+=60/rate*(1+jit(r==='vt'?.008:.012));pushV(G.tV,r==='vt'?'vt':'esc',r==='chb'&&rate<45?{wide:true}:null)}
    return}
  if(r==='af'){while(G.tV<until){G.tV+=60/rate*(.55+Math.random()*.9);pushV(G.tV,'n',{af:true})}return}
  if(r==='flutter'){const ratio=clamp(Math.round(300/rate),2,4);while(G.tV<until){G.tV+=.2*ratio;pushV(G.tV,'n')}return}
  if(r==='svt'){while(G.tV<until){G.tV+=60/rate;pushV(G.tV,'n')}return}
  while(G.tA<until){
    const rsa=S.breath?1-.06*(insp(G.tA)-.5):1;
    const pp=60/rate*rsa*(1+jit(.008));const tP=G.tA+pp;G.tA=tP;
    let pr=r==='tachy'?.14:.16,cond=true,kind='n';
    if(r==='avb1')pr=.30;if(r==='wpw'){pr=.10;kind='wpw'}if(r==='lbbb')kind='lbbb';if(r==='rbbb')kind='rbbb';
    if(r==='wenck'){const seq=[.16,.25,.31,null],s=seq[G.k%4];G.k++;if(s===null)cond=false;else pr=s}
    if(r==='mobitz2'){kind='rbbb';G.k++;if(G.k%4===0)cond=false}
    if(r==='pvc'){G.k++;const lv=G.ven[G.ven.length-1];
      if(lv&&G.k>2&&Math.random()<.22&&!lv.pvcNext){const tv=lv.t+.6*pp;pushV(tv,'pvc');if(tP-tv<.45){pushA(tP,false);continue}}}
    pushA(tP,cond);if(cond)pushV(tP+pr,kind,{pr});
    if(G.ven.length>1000)break;
  }
}
function retime(){
  if(!AC)return;const now=AC.currentTime,cut=now+.12;
  G.atr=G.atr.filter(a=>a.t<=cut);G.ven=G.ven.filter(v=>v.t<=cut);
  G.src=G.src.filter(s=>{if(s.t0>now+.02){try{s.node.stop()}catch(e){}return false}return true});
  G.snd=G.snd.filter(s=>s.t0<=now+.02);
  G.ven.forEach(v=>{if(v.t>now+.02)v.built=false});
  const la=G.atr[G.atr.length-1],lv=G.ven[G.ven.length-1];
  let base=lv?lv.t:now;if(base<now-1.2)base=now-.1;

}

/* ---------------- Glossary engine ---------------- */
const GK={};GLOSS.forEach(e=>GK[e.k]=e);
const rxEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
let GRX=null;
function buildGloss(){
  const ab=[],wd=[];
  for(const e of GLOSS){for(const a of e.a)ab.push([a,e.k]);for(const w of (e.w[LANG]||[]))wd.push([w,e.k])}
  ab.sort((x,y)=>y[0].length-x[0].length);wd.sort((x,y)=>y[0].replace(/\*/g,'').length-x[0].replace(/\*/g,'').length);
  const B0='(?<![\\p{L}\\p{N}])',B1='(?![\\p{L}\\p{N}])';
  try{
    GRX={
      ab:{re:new RegExp(B0+'(?:'+ab.map(([a])=>'('+rxEsc(a)+')').join('|')+')'+B1,'gu'),keys:ab.map(x=>x[1])},
      wd:wd.length?{re:new RegExp(B0+'(?:'+wd.map(([w])=>'('+rxEsc(w).replace(/\\\*/g,'\\p{L}*')+')').join('|')+')'+B1,'giu'),keys:wd.map(x=>x[1])}:null
    };
  }catch(err){GRX=null}
}
function nextHit(text,from){
  let best=null;
  for(const k of ['ab','wd']){const g=GRX[k];if(!g)continue;g.re.lastIndex=from;const m=g.re.exec(text);if(!m)continue;
    let gi=1;while(gi<m.length&&m[gi]===undefined)gi++;
    const hit={i:m.index,len:m[0].length,key:g.keys[gi-1]};
    if(!best||hit.i<best.i||(hit.i===best.i&&hit.len>best.len))best=hit}
  return best;
}
function glossify(root,seen){
  if(!GRX||!root)return;seen=seen||new Set();
  const nodes=[],tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){const p=n.parentElement;if(!p||p.closest('.g,[data-g],script,style,svg,canvas,textarea,input,output,.nog'))return NodeFilter.FILTER_REJECT;return n.nodeValue.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP}});
  while(tw.nextNode())nodes.push(tw.currentNode);
  for(const n of nodes){
    const text=n.nodeValue;let pos=0,last=0,frag=null;
    while(pos<text.length){const h=nextHit(text,pos);if(!h)break;pos=h.i+h.len;
      if(seen.has(h.key)||!GK[h.key])continue;seen.add(h.key);
      frag=frag||document.createDocumentFragment();
      if(h.i>last)frag.appendChild(document.createTextNode(text.slice(last,h.i)));
      const sp=document.createElement('span');sp.className='g';sp.dataset.g=h.key;sp.textContent=text.slice(h.i,h.i+h.len);
      if(!n.parentElement.closest('button'))sp.tabIndex=0;
      frag.appendChild(sp);last=pos}
    if(frag){if(last<text.length)frag.appendChild(document.createTextNode(text.slice(last)));n.parentNode.replaceChild(frag,n)}
  }
}
const isCyr=s=>/[Ѐ-ӿ]/.test(s);
function gTok(e){

function gSpot(e){return e.rh?rhT(e.rh).ecg:(e.s?(e.s[LANG]||e.s.en):'')}

/* tooltip */
const TIP={el:null,anchor:null,timer:0,touch:false};
function showTip(anchor){
  const e=GK[anchor.dataset.g];if(!e)return;
  clearTimeout(TIP.timer);
  if(TIP.anchor&&TIP.anchor!==anchor)TIP.anchor.classList.remove('tip-on');
  TIP.anchor=anchor;anchor.classList.add('tip-on');
  const t=TIP.el;t.innerHTML=tipHTML(e);t.classList.add('on');
  const r=anchor.getBoundingClientRect(),vw=innerWidth,vh=innerHeight,tw=t.offsetWidth,th=t.offsetHeight;
  let x=r.left+r.width/2-tw/2;x=clamp(x,10,vw-tw-10);
  let y=r.bottom+8;if(y+th>vh-10&&r.top-th-8>10)y=r.top-th-8;y=clamp(y,10,Math.max(10,vh-th-10));
  t.style.transform='none';t.style.left=x+'px';t.style.top=y+'px';
}

function initTips(){

  document.addEventListener('pointerout',ev=>{if(ev.pointerType==='touch')return;const a=ev.target.closest&&ev.target.closest('[data-g]');if(a&&!a.contains(ev.relatedTarget)){clearTimeout(TIP.timer);TIP.timer=setTimeout(hideTip,90)}});
  document.addEventListener('pointerdown',ev=>{if(ev.pointerType==='mouse')return;const a=ev.target.closest&&ev.target.closest('[data-g]');
    if(a){if(TIP.anchor===a&&!a.matches('button')){hideTip();return}showTip(a);clearTimeout(TIP.timer);TIP.timer=setTimeout(hideTip,6000)}else if(!ev.target.closest('#tip'))hideTip()},{passive:true});
  document.addEventListener('focusin',ev=>{const a=ev.target.closest&&ev.target.closest('[data-g]');if(a&&a.matches(':focus-visible'))showTip(a)});
  document.addEventListener('focusout',()=>{clearTimeout(TIP.timer);TIP.timer=setTimeout(hideTip,60)});
  document.addEventListener('keydown',ev=>{if(ev.key==='Escape')hideTip()});
  addEventListener('scroll',hideTip,{passive:true});addEventListener('resize',hideTip);
}

    if(e.rh){S.caseId=null;setRhythm(e.rh)}else{const d=DEMO[e.k],c=CASES.find(x=>x.id===d);if(c)applyCase(c);else if(RH[d]){S.caseId=null;setRhythm(d)}}
    $$('#glist .gi').forEach(x=>x.classList.toggle('on',x===b));
    const mon=$('.screen').getBoundingClientRect();if(mon.bottom<60||mon.top>innerHeight-60)$('.screen').closest('.card').scrollIntoView({behavior:'smooth',block:'start'})});
  markLearn();
}
function markLearn(){}

/* ---------------- Static text + language ---------------- */
function renderLangSwitch(){
  for(const id of ['#langIntro','#langTop']){const box=$(id);if(!box)continue;box.innerHTML=LANGS.map(l=>`<button data-l="${l}" class="${l===LANG?'on':''}" title="${I18N[l].name}" aria-pressed="${l===LANG}">${I18N[l].label}</button>`).join('');
    box.querySelectorAll('button').forEach(b=>b.onclick=()=>setLang(b.dataset.l))}
}
function renderStatic(){
  const U=ui();
  document.documentElement.lang=LANG==='uz'?'uz-Latn':LANG;
  renderLangSwitch();
  if($('#intro')){$('#iKick').textContent=U.kick;$('#iLede').innerHTML=U.lede;$('#iList').innerHTML=U.bullets.map(b=>`<li>${b}</li>`).join('');
    $('#goTxt').textContent=U.go;$('#iNote').textContent=U.note;glossify($('#iLede'))}
  $('#tagline').textContent=U.tagline;
  $$('#tabs button').forEach(b=>b.textContent=U.tabs[b.dataset.m]);
  $('#bpm').textContent=U.bpm;
  $('#elab').innerHTML=`<span data-g="ecg">${esc(U.ecgLab)}</span>`;
  $('#cap').innerHTML=U.cap;glossify($('#cap'));
  $('#tLink').textContent=U.coupling;$('#tFreeze').textContent=frozen?U.frozen:U.freeze;
  const LG=[['pwave','P','#7cc4ff'],['qrs','QRS','#e9edf2'],['twave','T','#8d97a6'],['s1','S1','#ffb648'],['s2','S2','#ffb648'],['s3','S3','#ff788c'],['s4','S4','#ff788c'],['os','OS','#ff788c'],['ec','EC','#ff788c'],['click','click','#ff788c']];
  $('#legend').innerHTML=`<span class="lt">${U.legend}</span>`+LG.map(([k,t,c])=>`<span data-g="${k}"><i style="background:${c}"></i>${t}</span>`).join('');
  $('#liveHeart').textContent=U.liveHeart;$('#sealHeart').textContent=U.sealHeart;$('#sealFind').textContent=U.sealFind;
  $('#tRA').textContent=U.chambers.ra;$('#tLA').textContent=U.chambers.la;$('#tRV').textContent=U.chambers.rv;$('#tLV').textContent=U.chambers.lv;
  $('#stethT').textContent=U.steth;
  $$('#segPiece button').forEach(b=>b.textContent=U.piece[b.dataset.v]);
  $$('#segOut button').forEach(b=>b.textContent=U.out[b.dataset.v]);
  $('#breathLbl').textContent=U.breathing;glossify($('#breathLbl'));
  $('#volLbl').textContent=U.volume;
  $$('#valves .vrow').forEach(r=>{r.querySelector('.vn').textContent=U.valveN[r.dataset.v];const o=VR[r.dataset.v];if(o.st)o.em.textContent=U.vstate[o.st]});
  $('#foot').innerHTML=U.footer;
  H.phaseTxt=null;$('#phase').textContent=U.phase.diast;
}
function setLang(l){
  if(!LANGS.includes(l)||l===LANG&&GRX)return;
  LANG=l;try{localStorage.setItem('smartheart-lang',l)}catch(e){}
  try{const u=new URL(location.href);if(u.searchParams.has('lang')){u.searchParams.set('lang',l);history.replaceState(null,'',u)}}catch(e){}
  hideTip();buildGloss();renderStatic();renderMode();findings();
}

/* ---------------- Wiring ---------------- */
function setMode(m){if(S.mode==='exam'&&m!=='exam'){EX=null;S.sealed=false}S.mode=m;hideTip();renderMode();findings()}
function initUI(){
  ['ra','la','rv','lv','vent','atria','sa','avn','intern','his','rbb','lbb','t1','t2','m1','m2'].forEach(id=>H[id]=$('#'+id));
  $('#valves').innerHTML=['mitral','tricuspid','aortic','pulmonic'].map(n=>`<div class="vrow" data-v="${n}"><span class="vn"></span><em></em><div class="vb"><u></u></div></div>`).join('');
  $$('#valves .vrow').forEach(r=>VR[r.dataset.v]={u:r.querySelector('u'),em:r.querySelector('em'),st:''});
  initTips();buildGloss();renderStatic();
  ['mitral','tricuspid','aortic','pulmonic'].forEach(n=>setValve(n,0,'closed'));
  $$('#tabs button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
  $$('#torso .dot').forEach(d=>d.onclick=()=>{S.site=d.dataset.s;syncControls();findings()});
  $$('#segPiece button').forEach(b=>b.onclick=()=>{S.piece=b.dataset.v;applyChest();syncControls()});
  $$('#segOut button').forEach(b=>b.onclick=()=>{S.out=b.dataset.v;if(AC){makeBands();applyChest();retime()}syncControls()});
  $('#swBreath').onclick=()=>{S.breath=!S.breath;syncControls()};
  $('#vol').oninput=e=>{S.vol=e.target.value/100;$('#volOut').textContent=e.target.value+'%';e.target.style.setProperty('--p',e.target.value+'%');applyVol()};$('#vol').style.setProperty('--p','80%');
  $('#tLink').onclick=e=>{S.link=!S.link;e.currentTarget.classList.toggle('on',S.link)};
  const fz=()=>{frozen=!frozen;$('#tFreeze').classList.toggle('on',frozen);$('#tFreeze').textContent=frozen?ui().frozen:ui().freeze;if(!frozen)lastT=null};
  $('#tFreeze').onclick=fz;
  document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();fz()}});
  $('#go').onclick=()=>{hideTip();startAudio();G.tA=G.tV=AC.currentTime+.05;G.base=baseFor(S.rhythm);$('#intro').classList.add('gone');setTimeout(()=>$('#intro').remove(),600);setupCanvas();setInterval(tick,40);tick();requestAnimationFrame(frame)};
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(AC)setupCanvas()},150)});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AC&&AC.state==='suspended')AC.resume()});
  renderMode();findings();
  try{const q=new URLSearchParams(location.search).get('case'),c0=CASES.find(x=>x.id===q);if(c0){S.mode='cases';applyCase(c0);renderMode();findings()}}catch(e){}
}
let hrT=0;
function frame(){
  const now=AC.currentTime;drawSweep(now);heartUpdate(now);
  if(now-hrT>.25){hrT=now;const r=S.rhythm;let txt='--';
    if(r==='asys')txt='0';else if(r!=='vf'){const vs=G.ven.filter(v=>v.t<=now).slice(-4);if(vs.length>=2){const span=vs[vs.length-1].t-vs[0].t;txt=Math.round(60*(vs.length-1)/span)}}
    $('#hr').textContent=txt;
    const I=insp(now),up=inspiring(now),U=ui();$('#bbar').style.width=(I*100).toFixed(0)+'%';$('#btxt').textContent=S.breath?(up?U.insp:U.exp):U.held;}
  requestAnimationFrame(frame);
}
initUI();

</script>
